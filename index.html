    return `<div class="page">${emptyHtml('Admins only', 'This is a separate interface for administrators.')}</div>`;
  }
  const tabs = [['overview', 'Overview'], ['approvals', 'Approvals'], ['assets', 'Assets'], ['users', 'Users'], ['reports', 'Reports'], ['online', 'Online'], ['mailbox', 'Mailbox']];
  const tabbar = `<div class="tabs">${tabs.map(([k, l]) => `<button class="tab ${STATE.adminTab === k ? 'active' : ''}" onclick="setAdminTab('${k}')">${l}</button>`).join('')}</div>`;
  return `<div class="page" style="max-width:1080px">
    <div class="section-head"><div><span class="section-eyebrow">Administration</span><h2>Admin Panel</h2><p>Moderate submissions, users, and review marketplace activity.</p></div></div>
    ${tabbar}
    <div id="admin-body">${loadingHtml()}</div>
  </div>`;
};
VIEWS_BIND.admin = async () => {
  const body = document.getElementById('admin-body');
  if (!body) return;
  body.innerHTML = loadingHtml();
  const html = await adminTabHtml(STATE.adminTab);
  body.innerHTML = html;
};
async function setAdminTab(tab) { STATE.adminTab = tab; await router(); }
async function adminTabHtml(tab) {
  if (tab === 'overview') {
    const o = await API.adminOverview(STATE.user);
    if (!o.ok) return `<p class="form-error">${esc(o.error)}</p>`;
    const d = o.data;
    const stat = (v, l) => `<div class="stat-card"><b>${v}</b><span>${l}</span></div>`;
    return `<div class="stat-grid">
      ${stat(d.users, 'Total users')}${stat(d.online, 'Online now')}${stat(d.assets, 'Total assets')}${stat(d.pending, 'Pending approval')}${stat(d.sales, 'Sales')}${stat(fmtMoney(d.revenue), 'Revenue')}${stat(d.reports, 'Open reports')}${stat(d.reviews, 'Reviews')}${stat(d.banned, 'Banned')}${stat(d.timedOut, 'Timed out')}
    </div>
    <p class="muted small mt">Admins are protected from bans and timeouts — moderation actions are never available against Admin accounts.</p>`;
  }
  if (tab === 'approvals') {
    const [p, r] = await Promise.all([API.adminPending(STATE.user), API.adminRejected(STATE.user)]);
    const pend = p.ok ? p.data : [];
    const rej = r.ok ? r.data : [];
    return `<h3 style="font-family:var(--font-display);font-size:17px;margin-bottom:14px">Pending submissions (${pend.length})</h3>
      ${pend.length ? pend.map(a => `
        <div class="approve-card mb">
          <div class="thumb">${thumbHtml(a.category, 26)}</div>
          <div class="info">
            <h4>${esc(a.title)} <span class="muted small" style="font-weight:400">· ${fmtMoney(a.price)}</span></h4>
            <div class="muted small mb">by <a href="#/profile/${esc(a.owner.handle)}">${esc(a.owner.displayName)}</a> ${badgeHtml(a.owner.role)} · ${catBadge(a.category)} · posted ${timeAgo(a.createdAt)}</div>
            <div class="desc">${esc(a.description)}</div>
            <div class="muted small mt">File: <span class="mono">${esc(a.fileName)}</span></div>
          </div>
          <div class="row" style="gap:8px;flex-wrap:wrap">
            <button class="btn btn-ghost btn-sm" onclick="onAdminDownload('${a.id}')">${ICON.download} File</button>
            <button class="btn btn-ghost btn-sm" onclick="onAdminReject('${a.id}')">Reject</button>
            <button class="btn btn-primary btn-sm" onclick="onAdminApprove('${a.id}')">${ICON.check} Approve</button>
          </div></div>`).join('')
      : emptyHtml('Queue is clear', 'No assets are waiting for approval.')}
      <h3 class="mt2" style="font-family:var(--font-display);font-size:17px;margin-bottom:14px">Rejected submissions (${rej.length})</h3>
      ${rej.length ? rej.map(a => `<div class="approve-card mb"><div class="thumb">${thumbHtml(a.category, 26)}</div><div class="info"><h4>${esc(a.title)}</h4><div class="muted small mb">by ${esc(a.owner.displayName)} · ${timeAgo(a.createdAt)}</div><div class="desc" style="color:var(--text-2)">${esc(a.rejectReason)}</div></div></div>`).join('')
      : `<p class="muted small">No rejected submissions.</p>`}`;
  }
  if (tab === 'assets') {
    const r = await API.adminAssets(STATE.user);
    const list = r.ok ? r.data : [];
    return `<div class="table-wrap"><table class="table">
      <thead><tr><th>Asset</th><th>Owner</th><th>Category</th><th>Price</th><th>Sales</th><th>Status</th><th></th></tr></thead>
      <tbody>${list.map(a => `<tr>
        <td><div class="row" style="gap:10px"><span style="width:34px;height:26px;border-radius:6px;overflow:hidden;position:relative;flex-shrink:0;border:1px solid var(--border)">${thumbHtml(a.category, 14)}</span><a href="#/asset/${a.id}" class="bold">${esc(a.title)}</a></div></td>
        <td><a href="#/profile/${esc(a.owner.handle)}">${esc(a.owner.displayName)}</a></td>
        <td>${CAT_LABEL[a.category]}</td><td>${fmtMoney(a.price)}</td><td>${a.sales}</td><td>${statusBadge(a.status, a.rejectReason)}</td>
        <td><div class="row-actions"><button class="btn btn-ghost btn-sm" title="Access file" onclick="onAdminDownload('${a.id}')">${ICON.download}</button><button class="btn btn-danger btn-sm" title="Delete post" onclick="onAdminDelete('${a.id}')">${ICON.trash}</button></div></td>
      </tr>`).join('') || `<tr><td colspan="7"><div class="empty">No assets.</div></td></tr>`}</tbody></table></div>`;
  }
  if (tab === 'users') {
    const r = await API.adminUsers(STATE.user);
    const list = r.ok ? r.data : [];
    return `<div class="table-wrap"><table class="table">
      <thead><tr><th>User</th><th>Email</th><th>Role</th><th>Status</th><th>Moderation</th></tr></thead>
      <tbody>${list.map(u => {
        const isAdminUser = u.role === 'admin';
        const status = u.banned ? `<span class="status-pill status-rejected">Banned${u.banReason ? ' — ' + esc(u.banReason) : ''}</span>`
          : u.timeoutUntil && u.timeoutUntil > now() ? `<span class="status-pill status-pending">Timed out (${esc(timeoutText(u))})</span>`
          : '<span class="status-pill status-approved">Active</span>';
        const actions = isAdminUser
          ? `<span class="muted small">${ICON.shield} Protected — admins cannot be moderated</span>`
          : `<div class="row-actions">
              ${u.banned ? `<button class="btn btn-ghost btn-sm" onclick="onAdminUnban('${u.id}')">Unban</button>` : `<button class="btn btn-danger btn-sm" onclick="onAdminBan('${u.id}')">${ICON.ban} Ban</button>`}
              ${u.timeoutUntil && u.timeoutUntil > now() ? `<button class="btn btn-ghost btn-sm" onclick="onAdminClear('${u.id}')">Clear timeout</button>` : `<button class="btn btn-ghost btn-sm" onclick="onAdminTimeout('${u.id}')">${ICON.clock} Timeout</button>`}
            </div>`;
        return `<tr>
          <td><div class="user-row">${avatarHtml(u, 34)}<div><a class="bold" href="#/profile/${esc(u.handle)}">${esc(u.displayName)}</a><div class="muted small">@${esc(u.handle)} ${badgeHtml(u.role)}</div></div></div></td>
          <td class="muted">${esc(u.email)}</td>
          <td>${u.id === STATE.user.id ? badgeHtml(u.role) + ' <span class="muted small">(you)</span>' : u.role === 'admin' ? badgeHtml(u.role) + ' <span class="muted small">Protected</span>' : `<select class="select" style="width:auto;padding:6px 30px 6px 10px;font-size:12.5px;border-radius:8px" onchange="onAdminRole('${u.id}', this.value)" title="Change role">${['member', 'vip', 'admin'].map(r => `<option value="${r}" ${u.role === r ? 'selected' : ''}>${r === 'vip' ? 'VIP / Licensed' : r.charAt(0).toUpperCase() + r.slice(1)}</option>`).join('')}</select>`}</td>
          <td>${status}</td>
          <td>${actions}</td></tr>`;
      }).join('')}</tbody></table></div>`;
  }
  if (tab === 'reports') {
    const r = await API.adminReports(STATE.user);
    if (!r.ok) return `<p class="form-error">${esc(r.error)}</p>`;
    const { open, resolved } = r.data;
    const card = rep => {
      let title = '', ctx = '';
      if (rep.targetType === 'asset') {
        title = `Asset: ${rep.asset ? rep.asset.title : '(deleted)'}`;
        ctx = rep.asset ? `<a class="btn btn-ghost btn-sm" href="#/asset/${rep.asset.id}">${ICON.eye} View</a><button class="btn btn-danger btn-sm" onclick="onAdminDelete('${rep.asset.id}')">${ICON.trash} Delete post</button>` : '';
      } else if (rep.targetType === 'comment') {
        title = `Comment: “${rep.comment ? rep.comment.body.slice(0, 70) : '(deleted)'}”`;
        ctx = `<span class="muted small">on ${rep.comment && rep.comment.assetTitle ? esc(rep.comment.assetTitle) : 'a deleted asset'}</span>`;
      } else {
        title = `User: ${rep.user ? rep.user.displayName : '(deleted)'}`;
        ctx = rep.user && rep.user.role !== 'admin'
          ? `<button class="btn btn-danger btn-sm" onclick="onAdminBan('${rep.user.id}')">${ICON.ban} Ban</button><button class="btn btn-ghost btn-sm" onclick="onAdminTimeout('${rep.user.id}')">${ICON.clock} Timeout</button><a class="btn btn-ghost btn-sm" href="#/profile/${esc(rep.user.handle)}">${ICON.eye} Profile</a>`
          : (rep.user ? `<span class="muted small">${ICON.shield} Admin target — protected</span>` : '');
      }
      return `<div class="approve-card mb">
        <div class="thumb">${repIconHtml(rep.targetType)}</div>
        <div class="info">
          <h4>${esc(title)}</h4>
          <div class="muted small mb">Reported by ${esc(rep.reporter.displayName)} · ${timeAgo(rep.createdAt)} · <span class="badge plain">${esc(rep.reason)}</span></div>
          ${rep.details ? `<p class="muted small">${esc(rep.details)}</p>` : ''}
        </div>
        <div class="row" style="gap:8px;flex-wrap:wrap">${ctx}<button class="btn btn-primary btn-sm" onclick="onAdminResolve('${rep.id}')">${ICON.check} Resolve</button></div>
      </div>`;
    };
    return `<h3 style="font-family:var(--font-display);font-size:17px;margin-bottom:14px">Open reports (${open.length})</h3>
      ${open.length ? open.map(card).join('') : emptyHtml('No open reports', 'Reports from users will appear here for review.')}
      <h3 class="mt2" style="font-family:var(--font-display);font-size:17px;margin-bottom:14px">Resolved (${resolved.length})</h3>
      ${resolved.length ? resolved.map(card).join('') : '<p class="muted small">No resolved reports.</p>'}`;
  }
  if (tab === 'online') {
    const r = await API.adminSessions(STATE.user);
    const d = r.ok ? r.data : { rows: [], total: 0, online: 0 };
    return `<p class="muted mb"><b class="bold" style="color:var(--text)">${d.online}</b> users online right now · ${d.total} active sessions total (last 10 minutes counts as online).</p>
      <div class="card" style="padding:6px 0">${d.rows.map(s => `
        <div class="row" style="padding:12px 20px;border-bottom:1px solid var(--border);gap:12px">
          <span class="dot ${s.online ? 'on' : 'off'}"></span>
          ${avatarHtml(s.user, 32)}
          <div style="flex:1;min-width:0"><a class="bold" href="#/profile/${esc(s.user.handle)}">${esc(s.user.displayName)}</a> ${badgeHtml(s.user.role)}<div class="muted small">${esc(s.label)}</div></div>
          <span class="muted small">${s.online ? 'active ' + timeAgo(s.lastSeen) : 'last seen ' + timeAgo(s.lastSeen)}</span>
        </div>`).join('') || emptyHtml('No sessions', 'Sessions appear here after users log in.')}</div>`;
  }
  if (tab === 'mailbox') {
    const r = await API.adminEmails(STATE.user);
    const list = r.ok ? r.data : [];
    return `<p class="muted mb">Development mailbox — emails are delivered here instead of a real inbox.</p>
      ${list.length ? `<div class="card" style="padding:6px 0">${list.map(e => `
        <div style="padding:16px 20px;border-bottom:1px solid var(--border)">
          <div class="row" style="justify-content:space-between;gap:10px"><div><b>${esc(e.subject)}</b> <span class="muted small">· to ${esc(e.to)}</span></div><span class="muted small">${timeAgo(e.createdAt)}</span></div>
          <p class="muted small mt">${esc(e.body)}</p>
          ${e.link ? `<a class="btn btn-ghost btn-sm mt" href="${esc(e.link)}">${ICON.key} Open reset link</a>` : ''}
        </div>`).join('')}</div>` : emptyHtml('Mailbox empty', 'Sent emails will appear here.')}`;
  }
  return '';
}

/* ---- admin actions ---- */
async function onAdminApprove(id) {
  const r = await API.adminApprove(STATE.user, id);
  if (r.ok) { toast('Approved — the asset is now live on the marketplace.'); await router(); } else toast(r.error, 'err');
}
function onAdminReject(id) {
  promptModal({ title: 'Reject submission', label: 'Reason (shown to the creator)', placeholder: 'e.g. File is corrupted', required: true, danger: true, confirmLabel: 'Reject',
    onConfirm: async ({ value }) => { const r = await API.adminReject(STATE.user, id, value); r.ok ? (toast('Submission rejected.'), await router()) : toast(r.error, 'err'); } });
}
function onAdminDelete(id) {
  modal({ title: 'Delete this asset?', danger: true, confirmLabel: 'Delete', body: '<p>This removes the post permanently, including its file and history.</p>',
    onConfirm: async () => { const r = await API.adminDeleteAsset(STATE.user, id); r.ok ? (toast('Asset deleted.'), await router()) : toast(r.error, 'err'); } });
}
async function onAdminDownload(id) {
  const res = await API.download(id, STATE.user);
  triggerFileDownload(res);
}
function onAdminBan(id) {
  promptModal({ title: 'Ban user', label: 'Reason', placeholder: 'e.g. Marketplace fraud', required: true, danger: true, confirmLabel: 'Ban',
    onConfirm: async ({ value }) => { const r = await API.adminBan(STATE.user, id, value); r.ok ? (toast('User banned.'), await router()) : toast(r.error, 'err'); } });
}
function onAdminUnban(id) {
  modal({ title: 'Unban this user?', confirmLabel: 'Unban', body: '<p>The user will be able to log in again immediately.</p>',
    onConfirm: async () => { const r = await API.adminUnban(STATE.user, id); r.ok ? (toast('User unbanned.'), await router()) : toast(r.error, 'err'); } });
}
function onAdminTimeout(id) {
  promptModal({ title: 'Timeout user', label: 'Duration in minutes (1–10080)', placeholder: '30', type: 'number', confirmLabel: 'Timeout',
    onConfirm: async ({ value }) => { const r = await API.adminTimeout(STATE.user, id, value); r.ok ? (toast('User timed out — commenting, purchasing, and posting are blocked until it expires.'), await router()) : toast(r.error, 'err'); } });
}
function onAdminClear(id) {
  modal({ title: 'Clear this timeout?', confirmLabel: 'Clear timeout', body: '<p>Restores commenting, purchasing, and posting for this user.</p>',
    onConfirm: async () => { const r = await API.adminClearTimeout(STATE.user, id); r.ok ? (toast('Timeout cleared.'), await router()) : toast(r.error, 'err'); } });
}

/* ---- boot ---- */
async function init() {
  try {
    await API.boot();
    renderShell();
    window.addEventListener('hashchange', router);
    await router();
  } catch (err) {
    console.error('Boot failed', err);
    document.getElementById('app').innerHTML = `<div class="page">${emptyHtml('Could not start', 'The storage or server this app relies on could not be reached.')}</div>`;
  }
}
init();

</script>
</body>
</html>
