}
function initProfileTags(tags) { STATE._pfTags = (tags || []).filter(t => String(t).trim()); renderProfileTags(); }
function renderProfileTags() {
  const box = document.getElementById('pf-tags-box');
  if (!box) return;
  box.innerHTML = STATE._pfTags.length ? STATE._pfTags.map(t => `<span class="chip" style="padding:4px 10px;font-size:11.5px;cursor:default">#${esc(t)}<button type="button" class="chip-x" onclick="removeProfileTag('${esc(t)}')" aria-label="Remove tag">×</button></span>`).join('') : '<span class="muted small">No extra tags yet.</span>';
}
function addProfileTag(t) {
  t = String(t || '').trim();
  if (!t) { toast('Type a tag first.', 'err'); return; }
  if (STATE._pfTags.length >= 6) { toast('Maximum of 6 tags.', 'err'); return; }
  if (STATE._pfTags.some(x => x.toLowerCase() === t.toLowerCase())) { toast('That tag is already added.', 'err'); return; }
  STATE._pfTags.push(t);
  renderProfileTags();
}
function removeProfileTag(t) {
  STATE._pfTags = STATE._pfTags.filter(x => x.toLowerCase() !== String(t).toLowerCase());
  renderProfileTags();
}
async function onSaveProfileRoles(id) {
  const role = document.getElementById('pr-role').value;
  const [r1, r2] = await Promise.all([API.adminSetRole(STATE.user, id, role), API.adminSetTags(STATE.user, id, STATE._pfTags)]);
  if (!r1.ok) { toast(r1.error, 'err'); return; }
  if (!r2.ok) { toast(r2.error, 'err'); return; }
  toast('Roles & tags updated.');
  await router();
}

async function handleLogin(e) {
  e.preventDefault();
  const f = e.target;
  const res = await API.login({ login: f.login.value, password: f.password.value, acceptTerms: !!(f.acceptTerms && f.acceptTerms.checked) });
  if (!res.ok) { toast(res.error, 'err'); if (res.code === 'banned') await router(); return; }
  if (res.data && res.data.need2fa) { STATE.twoFactorUserId = res.data.userId; await router(); return; }
  STATE.user = res.data; renderHeader();
  if (isUnverified(res.data)) toast('Welcome back! Verify your email to unlock posting and purchasing — check your inbox.', 'warn');
  else toast('Welcome back, ' + res.data.displayName);
  SFX.play('crown'); go('/');
}

}

function totpLiveHtml(secret, digits = 6) {
  return `<div class="totp-live">

async function onSetup2fa() {
  const res = await API.setup2fa(STATE.user);
  if (!res.ok) { toast(res.error, 'err'); return; }
  const { secret, uri, email } = res.data;
  stopTotpTimer();
  const ov = modal({
    title: 'Set up two-factor authentication', confirmLabel: 'Enable 2FA',
    body: `<p>Add this secret to an authenticator app, or use the live code below during setup. You will need a code to log in from new sessions.</p>

    validate: async ov => {
      const code = ov.querySelector('#tfa-code').value.trim();
      if (!/^\d{6}$/.test(code)) { toast('Enter the 6-digit code.', 'err'); return false; }
      const r = await API.enable2fa(STATE.user, { code });
      if (!r.ok) { toast(r.error, 'err'); return false; }
      return true;
    },
    onConfirm: async () => { stopTotpTimer(); toast('Two-factor authentication enabled.'); await router(); },
    onClose: stopTotpTimer,
  });
  const tick = async () => {
    const el = document.getElementById('totp-code'); if (!el) { stopTotpTimer(); return; }
    const code = await totpCode(secret);

    const rem = 30 - (Math.floor(Date.now() / 1000) % 30);

    if (arc) arc.setAttribute('stroke-dashoffset', String(144.5 * (1 - rem / 30)));

  tick(); _totpTimer = setInterval(tick, 1000);
  ov._close = ov.querySelector('[data-act=cancel]').onclick;
}

async function onSubmitAsset(e) {
  e.preventDefault();
  const f = e.target;
  const fileInput = f.file;
  const file = fileInput.files && fileInput.files[0];
  if (file && file.size > 20 * 1024 * 1024) { toast('File is too large (max 20 MB).', 'err'); return; }
  const btn = f.querySelector('button[type=submit]');
  const origLabel = btn.textContent;
  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    let fileData = null, fileName = null;
    if (file) { fileData = await readFileAsDataURL(file); fileName = file.name; }
    const payload = { title: f.title.value, category: f.category.value, description: f.description.value, price: f.price.value, imageUrl: f.imageUrl.value.trim(), fileName, fileData };
    const res = f.id.value
      ? await API.updateAsset(STATE.user, f.id.value, payload)
      : await API.createAsset(STATE.user, payload);
    if (!res.ok) { toast(res.error, 'err'); return; }
    toast(f.id.value ? 'Changes submitted — back in the approval queue.' : 'Asset submitted for admin approval.');
    go('/my-assets');
  } catch (err) {
    console.error(err);
    toast('Submit failed — please try again.', 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = origLabel;
  }
}

/* Escape a value for a double-quoted Lua string. */
function luaEsc(s) { return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n'); }
function luaCodeFor(s) {
  const name = luaEsc(s.name);
  const pass = luaEsc(s.password);
  return `--[[ KINGS PRODUCTION · LICENSE SYSTEM ]]
-- Paste into ServerScriptService in Roblox Studio.
-- Enable: Game Settings → Security → "Allow HTTP Requests".

local HttpService = game:GetService("HttpService")
local Players = game:GetService("Players")

local CONFIG = {
	SystemName = "${name}",
	SystemPassword = "${pass}",
	ApiUrl = "https://kingsproduction.cc/api/systems/activate",
	HeartbeatUrl = "https://kingsproduction.cc/api/systems/heartbeat",
	PlayerUrl = "https://kingsproduction.cc/api/systems/device",
	HeartbeatSeconds = 300,
	ProtectedObjectName = "${name}",
}

local License = {}
License.IsActive = false
License.OnDenied = nil

local function post(url, payload)
	local ok, res = pcall(function()
		return HttpService:RequestAsync({
			Url = url, Method = "POST",
			Headers = { ["Content-Type"] = "application/json" },
			Body = HttpService:JSONEncode(payload),
		})
	end)
	if not ok or not res then return nil end
	local okDecode, json = pcall(function() return HttpService:JSONDecode(res.Body) end)
	if not okDecode then return nil end
	return json
end

local function applyDecision(active)
	License.IsActive = active
	if active then
		warn("[License] ACTIVE — system is licensed")
	else
		warn("[License] DENIED — disabling protected system")
	end
	if ProtectedObject then ProtectedObject.Disabled = not active end
	if not active and License.OnDenied then License.OnDenied() end
end

local ProtectedObject = nil

local function check(heartbeat)
	local res = post(heartbeat and CONFIG.HeartbeatUrl or CONFIG.ApiUrl, {
		systemName = CONFIG.SystemName,
		systemPassword = CONFIG.SystemPassword,
		deviceId = tostring(game.JobId),
	})
	if res then
		applyDecision(res.ok == true and res.data and res.data.active == true)
	else
		warn("[License] check failed, retrying later")
	end
end

local function registerPlayer(player)
	task.spawn(function()
		post(CONFIG.PlayerUrl, {
			systemName = CONFIG.SystemName,
			systemPassword = CONFIG.SystemPassword,
			playerId = tostring(player.UserId),
			playerName = player.Name,
		})
	end)
end

function License.Start(protectedObject)
	ProtectedObject = protectedObject or script
	check(false)
	task.spawn(function()
		while true do
			task.wait(CONFIG.HeartbeatSeconds)
			check(true)
		end
	end)
	Players.PlayerAdded:Connect(registerPlayer)
	for _, p in ipairs(Players:GetPlayers()) do registerPlayer(p) end
end

function License.IsLicensed()
	return License.IsActive
end

return License
--[[ SECURITY: obfuscate this script before shipping — the password lives here.
     The portal's pause/revoke controls kill any leaked copy instantly. ]]`;
}

  const done = () => { toast('Code copied — paste it into Roblox Studio.'); SFX.play('crown'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));

  try { document.execCommand('copy'); done && done(); } catch (e) { toast('Copy failed — select the code manually.', 'err'); }

}

function drawSalesChart(canvas) {
  const tip = document.getElementById('chart-tip');
  const box = canvas.parentElement;
  const dpr = window.devicePixelRatio || 1;
  const rect = box.getBoundingClientRect();
  const W = Math.max(200, rect.width), H = Math.max(120, rect.height);
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  /* gather data from the rendered buckets — re-fetch via the view's cached value is
     not available here, so read the buckets from the DOM-less store: the dashboard
     view re-renders into a fresh canvas each navigation, so we grab the buckets from
     the last dashboard payload kept on STATE. */
  const buckets = STATE.dashBuckets || [];
  const pad = { t: 12, r: 8, b: 22, l: 44 };
  const maxV = Math.max(1, ...buckets.map(b => b.revenue || 0));
  const n = buckets.length || 1;
  const bw = (W - pad.l - pad.r) / n;
  ctx.clearRect(0, 0, W, H);
  ctx.font = '10px Inter, sans-serif';
  ctx.textAlign = 'left';
  for (let g = 0; g <= 3; g++) {
    const y = pad.t + (H - pad.t - pad.b) * (1 - g / 3);
    ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
    ctx.fillStyle = '#65656e';
    ctx.fillText('$' + Math.round(maxV * g / 3).toLocaleString(), 2, y + 3);
  }
  const hits = [];
  buckets.forEach((b, i) => {
    const h = (H - pad.t - pad.b) * ((b.revenue || 0) / maxV);
    const x = pad.l + i * bw + bw * 0.16, w = Math.max(2, bw * 0.68);
    const y = H - pad.b - h;
    const grad = ctx.createLinearGradient(0, y, 0, H - pad.b);
    grad.addColorStop(0, 'rgba(212,175,55,.95)'); grad.addColorStop(1, 'rgba(212,175,55,.14)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, [2, 2, 0, 0]); else ctx.rect(x, y, w, h);
    ctx.fill();
    if (i % 5 === 0 || i === n - 1) {
      ctx.fillStyle = '#65656e'; ctx.textAlign = 'center';
      ctx.fillText(b.label, x + w / 2, H - 6);
    }
    hits.push({ x, y, w, h, b });
  });
  canvas.onmousemove = e => {
    const r = canvas.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const hit = hits.find(hh => mx >= hh.x && mx <= hh.x + hh.w && my >= hh.y && my <= H - pad.b + 8);
    if (!hit) { tip.style.opacity = 0; return; }
    tip.innerHTML = `<b>${hit.b.label}</b> · ${hit.b.sales} sale${hit.b.sales === 1 ? '' : 's'} · <b>${fmtUsd(hit.b.revenue)}</b>`;
    tip.style.opacity = 1;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.min(W - tw - 6, Math.max(6, hit.x + hit.w / 2 - tw / 2)) + 'px';
    tip.style.top = Math.max(4, hit.y - th - 8) + 'px';
  };
  canvas.onmouseleave = () => { tip.style.opacity = 0; };
}

async function handlePaidReturn(query) {
  const providerRef = query.token || query.source_id || query.source || null;
  const ords = await API.myOrders(STATE.user);
  const pending = ords.ok && ords.data.find(o => o.status === 'created' || o.status === 'paid');
  if (!pending) return;
  const res = await API.confirmPayment(pending.id, providerRef);
  if (res.ok) toast(res.data && res.data.vipUpgrade ? 'Payment confirmed! License issued — you are now VIP / Licensed. 👑' : 'Payment confirmed — license issued!');
  else toast(res.error, 'err');
  go('/license');
  await router();
}

async function onAssignLicense(purchaseId, e) {
  e.preventDefault();
  const r = await API.assignLicense(STATE.user, purchaseId, { gameId: e.target.gameId.value, gameName: e.target.gameName.value });

        <div style="padding:16px 20px;border-bottom:1px solid var(--border)">
          <div class="row" style="justify-content:space-between;gap:10px"><div><b>${esc(e.subject)}</b> <span class="muted small">· to ${esc(e.to)}</span></div><span class="muted small">${timeAgo(e.createdAt)}</span></div>
          <p class="muted small mt">${esc(e.body)}</p>

/* ---- loading screen + boot ---- */
function runLoaderProgress() {
  const fill = document.getElementById('loader-fill');
  const pct = document.getElementById('loader-pct');
  if (!fill) return;
  const start = performance.now(), dur = 1400;
  function tick(t) {
    const p = Math.min(1, (t - start) / dur);
    const v = Math.round((1 - Math.pow(1 - p, 3)) * 92);
    fill.style.width = v + '%';
    if (pct) pct.textContent = v + '%';
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
function finishLoader() {
  const l = document.getElementById('loader');
  if (!l) return;
  const fill = document.getElementById('loader-fill');
  const pct = document.getElementById('loader-pct');
  if (fill) fill.style.width = '100%';
  if (pct) pct.textContent = '100%';
  l.classList.add('done');
  setTimeout(() => l.remove(), 700);
}

/* ---- interactive effects: cursor glow + card tilt ---- */
function setupWow() {
  const fine = window.matchMedia('(hover:hover) and (pointer:fine)').matches;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!fine || reduce) return;
  const glow = document.createElement('div');
  glow.className = 'cursor-glow';
  document.body.appendChild(glow);
  let x = innerWidth / 2, y = innerHeight / 2, tx = x, ty = y, raf = null;
  document.addEventListener('mousemove', e => {
    tx = e.clientX; ty = e.clientY;
    glow.classList.add('on');
    if (!raf) raf = requestAnimationFrame(loop);
  }, { passive: true });
  document.addEventListener('mouseleave', () => glow.classList.remove('on'));
  function loop() {
    x += (tx - x) * 0.13; y += (ty - y) * 0.13;
    glow.style.transform = `translate(${x - 260}px, ${y - 260}px)`;
    if (Math.abs(tx - x) > 0.5 || Math.abs(ty - y) > 0.5) raf = requestAnimationFrame(loop);
    else { raf = null; glow.classList.remove('on'); }
  }
  const TILT = '.asset-card, .project-card, .creator-card';
  document.addEventListener('mousemove', e => {
    const card = e.target.closest(TILT);
    if (!card) return;
    const r = card.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width - 0.5;
    const py = (e.clientY - r.top) / r.height - 0.5;
    card.style.setProperty('--rx', (-py * 4).toFixed(2) + 'deg');
    card.style.setProperty('--ry', (px * 5).toFixed(2) + 'deg');
    card.style.setProperty('--ty', '-5px');
  }, { passive: true });
  document.addEventListener('mouseout', e => {
    const card = e.target.closest(TILT);
    if (card) { card.style.setProperty('--rx', '0deg'); card.style.setProperty('--ry', '0deg'); card.style.setProperty('--ty', '-4px'); }
  });
}

/* ---- scroll reveals (only when JS + motion are OK) ---- */
let _revealIO = null;
function setupReveal() {
  if (!('IntersectionObserver' in window) || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.body.classList.add('js-reveal');
  _revealIO = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('in'); _revealIO.unobserve(e.target); }
  }), { threshold: 0.06 });
  bindReveals();
}
function bindReveals() {
  if (!_revealIO) return;
  document.querySelectorAll('.section-head, .profile-hero, .tier, .approve-card, .creator-card, .asset-card, .project-card').forEach(el => {
    if (!el.classList.contains('in') && !el.dataset.revealed) { el.dataset.revealed = '1'; _revealIO.observe(el); }
  });
}

/* ---- hero particles + stat counters ---- */
function spawnParticles() {
  const host = document.querySelector('.hero-particles');
  if (!host || host.childElementCount) return;
  const n = Math.min(22, Math.max(10, Math.floor(innerWidth / 80)));
  for (let i = 0; i < n; i++) {
    const s = document.createElement('span');
    s.className = 'particle';
    const size = 2 + Math.random() * 4;
    s.style.cssText = `left:${Math.random() * 100}%;width:${size}px;height:${size}px;animation-duration:${7 + Math.random() * 9}s;animation-delay:${Math.random() * 8}s;opacity:${0.3 + Math.random() * 0.6}`;
    host.appendChild(s);
  }
}
function countUp(el, target) {
  if (!el) return;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const t = Number(target) || 0;
  if (reduce) { el.textContent = t.toLocaleString(); return; }
  const start = performance.now(), dur = 900;
  function tick(nowMs) {
    const p = Math.min(1, (nowMs - start) / dur);
    el.textContent = Math.round(t * (1 - Math.pow(1 - p, 3))).toLocaleString();
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

/* ---- site status: awake vs asleep (Render free tier sleeps when idle) ---- */
function startStatusPinger() {
  const el = document.getElementById('site-status');
  const txt = document.getElementById('site-status-txt');
  if (!el) return;
  async function ping() {
    const t0 = performance.now();
    let state = 'asleep';
    try {
      const ctrl = new AbortController();
      const to = setTimeout(() => ctrl.abort(), 4000);
      const res = await fetch('/api/health', { signal: ctrl.signal, cache: 'no-store' });
      clearTimeout(to);
      if (res.ok) state = (performance.now() - t0) > 1500 ? 'waking' : 'online';
    } catch (e) { state = 'asleep'; }
    el.className = 'site-status ' + state;
    if (txt) txt.textContent = state === 'online' ? 'Online · Ready' : state === 'waking' ? 'Waking up…' : 'Asleep · cold start on visit';
  }
  ping();
  setInterval(ping, 20000);
}

/* ---- scroll progress bar + back-to-top ---- */
function setupScrollFx() {
  const bar = document.createElement('div');
  bar.className = 'scroll-progress';
  bar.setAttribute('aria-hidden', 'true');
  document.body.appendChild(bar);
  const topBtn = document.createElement('button');
  topBtn.className = 'to-top';
  topBtn.setAttribute('aria-label', 'Back to top');
  topBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m0 0-5 5m5-5 5 5"/></svg>';
  topBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }));
  document.body.appendChild(topBtn);
  let ticking = false;
  const onScroll = () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      const h = document.documentElement;
      const max = h.scrollHeight - h.clientHeight;
      bar.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%';
      topBtn.classList.toggle('show', h.scrollTop > 480);
      ticking = false;
    });
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
}

function setupSounds() {

/* ---- click particle burst ---- */
function setupClickBurst() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.addEventListener('click', e => {
    if (e.target.closest('.like-btn')) return; // likes get their own bigger burst
    if (e.target.closest('a,button,input,select,textarea,label,.chip,.tab,.pm-card,.star-btn')) burstAt(e.clientX, e.clientY, 5);
    else burstAt(e.clientX, e.clientY, 8);
  }, { passive: true });
}
function burstAt(x, y, n = 10) {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const host = document.createElement('div');
  host.className = 'fx-burst';
  host.style.transform = `translate(${x}px, ${y}px)`;
  document.body.appendChild(host);
  const colors = ['#ffd97a', '#e8c96a', '#ffffff', '#d4af37'];
  for (let i = 0; i < n; i++) {
    const p = document.createElement('span');
    p.className = 'fx-particle';
    const ang = Math.random() * Math.PI * 2, dist = 24 + Math.random() * 46;
    const size = 2.5 + Math.random() * 4.5;
    p.style.cssText = `--dx:${Math.cos(ang) * dist}px;--dy:${Math.sin(ang) * dist}px;left:0;top:0;width:${size}px;height:${size}px;background:${colors[(Math.random() * colors.length) | 0]};box-shadow:0 0 ${4 + Math.random() * 8}px rgba(212,175,55,.8)`;
    host.appendChild(p);
  }
  setTimeout(() => host.remove(), 820);

/* ---- cursor sparkle trail ---- */
function setupSparkleTrail() {
  if (!window.matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let last = 0;
  document.addEventListener('mousemove', e => {
    const t = performance.now();
    if (t - last < 55) return;
    last = t;
    const s = document.createElement('span');
    s.className = 'fx-sparkle';
    s.textContent = '✦';
    s.style.cssText = `left:${e.clientX}px;top:${e.clientY}px;font-size:${7 + Math.random() * 6}px;--sx:${(Math.random() - .5) * 30}px;--sy:${-(10 + Math.random() * 22)}px`;
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 860);
  }, { passive: true });
}

/* ---- magnetic controls ---- */
function setupMagnetic() {
  if (!window.matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const pick = () => Array.from(document.querySelectorAll('.hero-cta .btn, .to-top'));
  document.addEventListener('mousemove', e => {
    pick().forEach(el => {
      const r = el.getBoundingClientRect();
      const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
      const d = Math.hypot(dx, dy);
      if (d < 110 && !reduce) {
        const pull = Math.min(1, (110 - d) / 110) * 7;
        el.style.transform = `translate(${(dx / d) * pull}px, ${(dy / d) * pull}px)`;
      } else if (el.style.transform) el.style.transform = '';
    });
  }, { passive: true });
}

/* ---- hero rotor: rotating tagline ---- */
let _rotorStarted = false;
function setupRotor() {
  const el = document.querySelector('.rotor-txt');
  if (!el || _rotorStarted) return;
  _rotorStarted = true;
  const phrases = ['Licensed & device-secured keys', 'One-time purchase · lifetime updates', 'Protected by advanced device licensing', 'Trusted by premium creators'];
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let i = 0;
  setInterval(() => {
    i = (i + 1) % phrases.length;
    el.style.opacity = '0';
    el.style.transform = 'translateY(8px)';
    setTimeout(() => {
      el.textContent = phrases[i];
      el.style.opacity = '';
      el.style.transform = '';
    }, 300);
  }, 3600);
}

/* ---- marquee: duplicate content for a seamless loop ---- */
function setupMarquee() {
  const track = document.querySelector('.marquee-track');
  if (!track || track.dataset.dup) return;
  track.dataset.dup = '1';
  track.innerHTML += track.innerHTML;
}

/* ---- boot ---- */
async function init() {
  const started = performance.now();
  runLoaderProgress();
  setupWow();
  setupReveal();
  setupScrollFx();
  setupDust();
  setupSounds();
  setupClickBurst();
  setupSparkleTrail();
  setupMagnetic();
  try {
    await API.boot();
    renderShell();
    startStatusPinger();
    window.addEventListener('hashchange', router);
    await router();
  } catch (err) {
    console.error('Boot failed', err);
    document.getElementById('app').innerHTML = `<div class="page">${emptyHtml('Could not start', 'The storage or server this app relies on could not be reached.')}</div>`;
  } finally {
    setTimeout(finishLoader, Math.max(0, 1500 - (performance.now() - started)));
  }
}
init();

</script>
</body>
</html>
