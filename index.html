local bannedThisSession = {}
local function banPlayers(reason)
	for _, player in ipairs(Players:GetPlayers()) do
		local uid = player.UserId
		if not bannedThisSession[uid] then
			bannedThisSession[uid] = true
			local cfg = Instance.new("BanConfig")
			cfg.Duration = -1                -- permanent until lifted
			cfg.DisplayReason = "This game is using an unlicensed copy of " .. CONFIG.SystemName .. ". Kings Production license enforcement."
			cfg.ExcludeAltAccounts = false
			cfg.ApplyToUniverse = true
			local okBan, err = pcall(function()
				Players:BanAsync({ UserIds = { uid }, BanConfigs = { cfg } })
			end)
			if okBan then
				log("Banned " .. player.Name)
			else
				log("Ban failed for " .. player.Name .. " (" .. tostring(err) .. ") — kicking instead")
				player:Kick(cfg.DisplayReason)
			end
		end
	end
end

-- License restored → lift bans for players present in the game (they are
-- the ones rejoining now that the game is allowed again).
local unbannedThisSession = {}
local function unbanPlayers()
	for _, player in ipairs(Players:GetPlayers()) do
		local uid = player.UserId
		if not unbannedThisSession[uid] then
			unbannedThisSession[uid] = true
			local okUnban, err = pcall(function()
				Players:UnbanAsync({ UserIds = { uid } })
			end)
			if okUnban then log("Lifted ban for " .. player.Name)
			else log("Unban failed for " .. player.Name .. " (" .. tostring(err) .. ")") end
		end
	end
end

-- Kick EVERY player in the game (revokeAll) — used when the license is
-- denied/revoked/pending and Kick-on-deny is enabled, so a leaked copy
-- never keeps running with a free activation.
local function kickEveryone(reason)
	for _, player in ipairs(Players:GetPlayers()) do
		player:Kick(tostring(reason or "This game is not licensed to use this system."))
	end
end

local function applyDecision(res)
	local active = res and res.ok == true and res.data and res.data.active == true
	License.IsActive = active
	License.LastCheck = os.time()
	if active then
		log("ACTIVE — system is licensed")
		if res.data.unban then task.spawn(unbanPlayers) end
	else
		log("DENIED — " .. tostring(res and res.data and res.data.reason or "license not active") .. " — disabling protected system")
	end
	setProtectedDisabled(not active)
	kickPlayers(res and res.data and res.data.revokedPlayers)
	if not active then
		-- Escalation ladder (flags come from the web dashboard toggles):
		if res.data and res.data.banAll then
			banPlayers(res and res.data and res.data.reason)
		elseif res.data and res.data.revokeAll then
			kickEveryone(res and res.data and res.data.reason)
		end
	end
	if not active and License.OnDenied then
		License.OnDenied()
	end
end

-- A stable, readable label for the device list on the web dashboard.
local function deviceLabel()
	local jobId = tostring(game.JobId)
	if jobId ~= "" and jobId ~= "0" then
		return "Server " .. string.sub(jobId, 1, 8)
	end
	return "Studio"
end

-- Resolve the experience's real name + creator (see gameMeta below)
local function gameMeta()
	-- Resolve the experience's REAL name + creator name via MarketplaceService
	-- (works in Studio and in published games, no HTTP request needed).
	-- Falls back to game.Name / "User <id>" or "Group <id>" if unavailable.
	local name, owner = game.Name, nil
	local ok, info = pcall(function()
		return MarketplaceService:GetProductInfo(game.PlaceId, Enum.InfoType.Game)
	end)
	if ok and info then
		if info.Name and info.Name ~= "" then name = info.Name end
		if info.Creator and info.Creator.Name and info.Creator.Name ~= "" then
			owner = info.Creator.Name
		end
	end
	if not owner then
		local t = tostring(game.CreatorType):gsub("Enum%.CreatorType%.", "")
		owner = t .. " " .. tostring(game.CreatorId)
	end
	return name, owner
end
local function check(heartbeat)
	local gmName, gmOwner = gameMeta()
	local payload = {
		systemName = CONFIG.SystemName,
		systemPassword = CONFIG.SystemPassword,
		deviceId = tostring(game.JobId),   -- per-server id; pair with UserId for device view
		deviceName = deviceLabel(),
		placeId = tostring(game.PlaceId),  -- so the creator sees (and can gate) each game using the system
		gameName = gmName,
		gameOwner = gmOwner,
		gameOwnerType = tostring(game.CreatorType),
	}
	local res = post(heartbeat and CONFIG.HeartbeatUrl or CONFIG.ApiUrl, payload)
	if res then
		applyDecision(res)
	else
		-- Network blip: do NOT kill a licensed game over one failed request.
		log("check failed (" .. tostring(License.LastError) .. "), retrying in " .. CONFIG.RetrySeconds .. "s")
	end
end

-- Register a player so the creator can see active devices on the web, and
-- kick immediately if that player's device was already kicked.
local function registerPlayer(player)
	task.spawn(function()
		local gmName, gmOwner = gameMeta()
		local res = post(CONFIG.PlayerUrl, {
			systemName = CONFIG.SystemName,
			systemPassword = CONFIG.SystemPassword,
			playerId = tostring(player.UserId),
			playerName = player.Name,
			placeId = tostring(game.PlaceId),  -- registers which game the player is using the system in
			gameName = gmName,
			gameOwner = gmOwner,
			gameOwnerType = tostring(game.CreatorType),
		})
		if res and res.ok == true and res.data then
			if res.data.kicked then
				player:Kick("This device is not authorized for this system.")
			elseif res.data.banAll then
				banPlayers(res and res.data and res.data.reason)
			elseif res.data.revokeAll then
				player:Kick(tostring(res.data.reason or "This game is not licensed to use this system."))
			end
		end
	end)
end

-- Start the license system. Pass the object to disable when unlicensed.
function License.Start(protectedObject)
	ProtectedObject = protectedObject or script
	check(false)

	task.spawn(function()
		while true do
			task.wait(CONFIG.HeartbeatSeconds)
			check(true)
		end
	end)

	Players.PlayerAdded:Connect(registerPlayer)
	for _, p in ipairs(Players:GetPlayers()) do
		registerPlayer(p)
	end
end

-- Call from your own scripts: if false, refuse to run protected features
function License.IsLicensed()
	return License.IsActive
end

return License
`
/* ==== KP-LICENSE-END ==== */;

/* The combined Studio script: the license module (baked name + password)
   runs FIRST, gates itself with License.Start(), and only then does the
   seller's own code — pasted between the markers — run. The module's final
   `return License` is stripped (a Script cannot return a value mid-file)
   and the tamper fingerprint is left blank, because the combined source no
   longer matches the module the fingerprint was computed from. */
const KP_CODE_BEGIN = '-- ========== KINGS PROTECTED CODE — paste YOUR system code between these markers ========== */'.replace(' */', '');
const KP_CODE_END = '-- ========== END OF KINGS PROTECTED CODE ==========';
function combinedScript(licenseModule, userCode) {
  const head = licenseModule
    .replace(/local TAMPER_KEY = "[^"]*"/, 'local TAMPER_KEY = ""')
    .replace(/\nreturn License\s*$/, '\n');
  const code = String(userCode || '').trim();
  return `${head}\n-- ▶ LICENSE CODE — starts first and gates everything below it.\nLicense.Start(script)\n\n-- Denied or waiting for game approval? Stop here — the module above logs the reason.\nif not License.IsLicensed() then return end\n\n-- ================== YOUR STUDIO CODE BELOW / SYSTEM CODE BELOW ==================\n\n${KP_CODE_BEGIN}\n${code || '-- ⬇ paste your system code here (it only runs while the license is ACTIVE)'}\n${KP_CODE_END}\n-- ================== END OF SYSTEM CODE ==================\n`;
}
async function luaCodeFor(s) {
  const name = luaEsc(s.name);
  const pass = luaEsc(s.password);
  // The canonical script lives in system/license_system.lua and is synced
  // into LICENSE_TEMPLATE by npm run build — never edit this by hand.
  const tpl = LICENSE_TEMPLATE
    .replace(/__SYSTEM_NAME__/g, name)
    .replace(/__SYSTEM_PASSWORD__/g, pass)
    .replace(/__PROTECTED_OBJECT__/g, name);
  // Lock the tamper fingerprint: SHA-256 of the source with the TAMPER_KEY
  // line blanked, BASE64-encoded (matching Roblox crypt.hash), first 12 chars
  // — the exact rule the Lua side uses.
  let key = '';
  if (window.crypto && crypto.subtle && crypto.subtle.digest) {
    const cleaned = tpl.replace(/local TAMPER_KEY = "[^"]*"/, 'local TAMPER_KEY = ""');
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(cleaned));
    const bytes = new Uint8Array(buf);
    let bin = '';
    bytes.forEach(b => { bin += String.fromCharCode(b); });
    key = btoa(bin).slice(0, 12);
  }
  return tpl.replace(/__FINGERPRINT__/, key);
}
function copyText(text) {

}

  ta.value = text; ta.style.cssText = 'position:fixed;left:-9999px;top:0';

}

function drawSalesChart(canvas) {
  const tip = document.getElementById('chart-tip');
  const box = canvas.parentElement;
  const dpr = window.devicePixelRatio || 1;
  const rect = box.getBoundingClientRect();
  const W = Math.max(200, rect.width), H = Math.max(120, rect.height);
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  /* gather data from the rendered buckets — re-fetch via the view's cached value is
     not available here, so read the buckets from the DOM-less store: the dashboard
     view re-renders into a fresh canvas each navigation, so we grab the buckets from
     the last dashboard payload kept on STATE. */
  const buckets = STATE.dashBuckets || [];
  const pad = { t: 12, r: 8, b: 22, l: 44 };
  const maxV = Math.max(1, ...buckets.map(b => b.revenue || 0));
  const n = buckets.length || 1;
  const bw = (W - pad.l - pad.r) / n;
  ctx.clearRect(0, 0, W, H);
  ctx.font = '10px Inter, sans-serif';
  ctx.textAlign = 'left';
  for (let g = 0; g <= 3; g++) {
    const y = pad.t + (H - pad.t - pad.b) * (1 - g / 3);
    ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
    ctx.fillStyle = '#65656e';
    ctx.fillText('$' + Math.round(maxV * g / 3).toLocaleString(), 2, y + 3);
  }
  const hits = [];
  buckets.forEach((b, i) => {
    const h = (H - pad.t - pad.b) * ((b.revenue || 0) / maxV);
    const x = pad.l + i * bw + bw * 0.16, w = Math.max(2, bw * 0.68);
    const y = H - pad.b - h;
    const grad = ctx.createLinearGradient(0, y, 0, H - pad.b);
    grad.addColorStop(0, 'rgba(212,175,55,.95)'); grad.addColorStop(1, 'rgba(212,175,55,.14)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, [2, 2, 0, 0]); else ctx.rect(x, y, w, h);
    ctx.fill();
    if (i % 5 === 0 || i === n - 1) {
      ctx.fillStyle = '#65656e'; ctx.textAlign = 'center';
      ctx.fillText(b.label, x + w / 2, H - 6);
    }
    hits.push({ x, y, w, h, b });
  });
  canvas.onmousemove = e => {
    const r = canvas.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const hit = hits.find(hh => mx >= hh.x && mx <= hh.x + hh.w && my >= hh.y && my <= H - pad.b + 8);
    if (!hit) { tip.style.opacity = 0; return; }
    tip.innerHTML = `<b>${hit.b.label}</b> · ${hit.b.sales} sale${hit.b.sales === 1 ? '' : 's'} · <b>${fmtUsd(hit.b.revenue)}</b>`;
    tip.style.opacity = 1;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.min(W - tw - 6, Math.max(6, hit.x + hit.w / 2 - tw / 2)) + 'px';
    tip.style.top = Math.max(4, hit.y - th - 8) + 'px';
  };
  canvas.onmouseleave = () => { tip.style.opacity = 0; };
}

function addPfImgRow(box, url, onPaint) {
  const row = document.createElement('div');
  row.className = 'pf-img-row';
  row.innerHTML = `<input class="input" type="url" placeholder="https://i.imgur.com/…jpg" value="${esc(url)}"><button class="btn btn-ghost btn-sm" type="button" title="Remove photo">${ICON.close}</button>`;
  const inp = row.querySelector('input');
  inp.addEventListener('input', () => onPaint && onPaint());
  row.querySelector('button').onclick = () => { row.remove(); onPaint && onPaint(); };
  row.appendChild(imageUploadButton(inp, { onDone: onPaint }));
  box.appendChild(row);
}
function addPfLinkRow(box, url) {
  const row = document.createElement('div');
  row.className = 'pf-link-row';
  const t = detectLink(url || '');
  row.innerHTML = `<input class="input" type="url" placeholder="https://…" value="${esc(url)}"><span class="pf-link-icon">${ICON[t.id] || ICON.link}</span><button class="btn btn-ghost btn-sm" type="button" title="Remove link">${ICON.close}</button>`;

  inp.addEventListener('input', () => { const d = detectLink(inp.value); row.querySelector('.pf-link-icon').innerHTML = ICON[d.id] || ICON.link; });
  row.querySelector('button').onclick = () => row.remove();
  box.appendChild(row);
  inp.focus();
}

async function handleSubPaidReturn(query) {

  go('/subscription');
  await router();
}

          <div class="row" style="gap:8px;flex-wrap:wrap">

        ${s.staffNote ? `<div class="sec-note" style="margin-top:12px"><b>${ICON.shield} Staff note (visible to the owner on their dashboard):</b> ${esc(s.staffNote)}</div>` : ''}

      <div class="card card-pad" style="margin-bottom:16px">
        <h3 style="font-family:var(--font-display);font-size:15px;margin-bottom:10px">Owner</h3>
        <div class="row" style="gap:12px;align-items:center;flex-wrap:wrap">
          ${avatarHtml(o, 44)}
          <div style="flex:1;min-width:180px"><a class="bold" href="#/profile/${esc(o.handle || '')}">${esc(o.displayName || '(deleted)')}</a> ${o.role ? badgeHtml(o.role, null, o) : ''}<div class="muted small">@${esc(o.handle || '')} · Subscription ${Number(o.protectionTier) || 0} · Contract ${Number(o.contractTier) || 0}${o.restrictedUntil && o.restrictedUntil > now() ? ' · <b style=\"color:var(--gold)\">RESTRICTED</b>' : ''}</div></div>
          <button class="btn btn-ghost btn-sm" onclick="STATE.adminSub='${o.id}';STATE.adminSys=null;router()">${ICON.eye} Open subscriber view</button>

      ${s.games.length ? s.games.map(g => `<div class="row" style="padding:10px 16px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;gap:10px;flex-wrap:wrap">
        <span style="flex:1;min-width:200px"><b>${g.gameName ? esc(g.gameName) : 'Unknown game'}</b> ${sysGameBadge(g.status)}<div class="muted small">Place ID ${esc(g.placeId)} · ${g.gameOwner ? esc(g.gameOwner) : 'unknown creator'} · last seen ${timeAgo(g.lastSeenAt)}</div></span>
        ${g.status === 'active' ? `<button class="btn btn-ghost btn-sm" onclick="onSetSystemGameStatus('${g.id}','revoked')">${ICON.ban} Revoke</button><button class="btn btn-danger btn-sm" onclick="onSetSystemGameStatus('${g.id}','blacklisted')">${ICON.flag} Blacklist</button>` : `<button class="btn btn-primary btn-sm" onclick="onSetSystemGameStatus('${g.id}','active')">${ICON.check} Allow</button>`}
      </div>`).join('') : `<div class="card card-pad muted small">No games have checked in yet.</div>`}`;
    }
    /* --- Subscriber detail view --- */
    if (STATE.adminSub) {
      const d = await API.adminSubscriberDetail(STATE.user, STATE.adminSub);
      if (!d.ok) { STATE.adminSub = null; return `<p class="form-error">${esc(d.error)}</p>`; }
      const u = d.data;
      const p = u.profile;
      const tierLine = t => t === 0 ? '<span class="off">none</span>' : `<b style="color:var(--gold)">${t} / 3</b>`;
      return `<button class="btn btn-ghost btn-sm" style="margin-bottom:14px" onclick="STATE.adminSub=null;router()">${ICON.chevron} All registered</button>
      <div class="card card-pad" style="margin-bottom:16px">
        <div class="row" style="gap:14px;align-items:center;flex-wrap:wrap">
          ${avatarHtml(p, 56)}
          <div style="flex:1;min-width:200px">
            <a class="bold" style="font-family:var(--font-display);font-size:17px" href="#/profile/${esc(p.handle)}">${esc(p.displayName)}</a> ${badgeHtml(p.role, null, p)}
            <div class="muted small">@${esc(p.handle)} · ${esc(p.email)} · joined ${fmtDate(p.createdAt)}${p.country ? ' · ' + esc(p.country) : ''}</div>
            ${p.bio ? `<div class="muted small" style="margin-top:6px">${esc(p.bio)}</div>` : ''}
          </div>
          ${p.banned ? '<span class="badge soft-red">BANNED</span>' : ''}${p.restrictedUntil && p.restrictedUntil > now() ? `<span class="badge warn" title="${esc(p.restrictReason || '')}">RESTRICTED</span>` : ''}
        </div>
      </div>
      <div class="dash-grid" style="margin-bottom:16px">
        <div class="dash-stat"><div class="k">Subscription tier</div><div class="v">${tierLine(u.protectionTier)}</div></div>
        <div class="dash-stat"><div class="k">Contract tier</div><div class="v">${tierLine(u.contractTier)}</div></div>
        <div class="dash-stat"><div class="k">Posts</div><div class="v">${u.stats.assets}</div></div>
        <div class="dash-stat"><div class="k">Sales</div><div class="v blue">${u.stats.sales}</div></div>
        <div class="dash-stat"><div class="k">Revenue</div><div class="v">${fmtUsd(u.stats.revenue)}</div></div>
      </div>
      ${revokesBlock}
      <div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:16px">
        ${(u.protectionTier > 0 || u.contractTier > 0) ? `<button class="btn btn-ghost btn-sm" onclick="onAdminSubRevoke('${p.id}')">Revoke subscription</button>${canApprove ? `<button class="btn btn-danger btn-sm" onclick="onAdminUnsubscribePlan('${p.id}')">Unsubscribe now</button>` : ''}` : ''}
        ${p.restrictedUntil && p.restrictedUntil > now() ? `<button class="btn btn-ghost btn-sm" onclick="onAdminRestrict('${p.id}', false)">Unrestrict user</button>` : `<button class="btn btn-ghost btn-sm" onclick="onAdminRestrict('${p.id}', true)">${ICON.shield} Restrict user</button>`}
      </div>
      <h3 style="font-family:var(--font-display);font-size:15px;margin-bottom:10px">Registered systems (${u.systems.length})</h3>
      ${u.systems.length ? u.systems.map(s => `<div class="card" style="margin-bottom:10px;overflow:hidden">
        <div class="row" style="padding:12px 18px;gap:10px;flex-wrap:wrap">
          <span style="flex:1;min-width:200px"><b>${ICON.system} ${esc(s.name)}</b> ${s.status === 'active' ? '<span class="badge ok">ACTIVE</span>' : '<span class="badge plain">PAUSED</span>'}${s.staffNote ? ` <span class="badge warn" title="${esc(s.staffNote)}">note</span>` : ''}
            <div class="muted small">Registered ${fmtDate(s.createdAt)} · last seen ${s.lastSeenAt ? timeAgo(s.lastSeenAt) : 'never'} · ${s.games} game${s.games === 1 ? '' : 's'} · ${s.devices} device${s.devices === 1 ? '' : 's'}</div></span>
          <button class="btn btn-ghost btn-sm" onclick="STATE.adminSys='${s.id}';router()">${ICON.eye} Open</button>
          ${s.status === 'active' ? `<button class="btn btn-ghost btn-sm" onclick="onAdminSystemState('${s.id}','disabled')">${ICON.ban} Pause</button>` : `<button class="btn btn-ghost btn-sm" onclick="onAdminSystemState('${s.id}','active')">${ICON.check} Resume</button>`}
          <button class="btn btn-ghost btn-sm" onclick="onAdminSystemNote('${s.id}')">${ICON.edit} Note</button>
          ${canApprove ? `<button class="btn btn-danger btn-sm" onclick="onAdminUnregisterSystem('${s.id}')">${ICON.trash} Unregister</button>` : ''}
        </div>
      </div>`).join('') : `<div class="card card-pad muted small">This user has no registered systems.</div>`}`;
    }
    /* --- Subscriber list (everyone with a plan, then everyone else) --- */
    const users = usrR.ok ? usrR.data : [];
    const subRow = u => `<tr>
      <td><div class="user-row">${avatarHtml(u, 32)}<div><a class="bold" href="#/profile/${esc(u.handle)}">${esc(u.displayName)}</a><div class="muted small">@${esc(u.handle)}</div></div></div></td>
      <td>${badgeHtml(u.role, null, u)}</td>
      <td><span class="badge ${u.protectionTier > 0 ? 'vip' : 'plain'}">Subscription ${u.protectionTier || 0}</span> <span class="badge ${u.contractTier > 0 ? 'vip' : 'plain'}">Contract ${u.contractTier || 0}</span></td>
      <td>${u.systems != null ? u.systems : ''}</td>
      <td><button class="btn btn-ghost btn-sm" onclick="STATE.adminSub='${u.id}';STATE.adminSys=null;router()">${ICON.eye} View</button></td>
    </tr>`;
    const sysCountByOwner = {};
    systems.forEach(s => { const k = s.owner && s.owner.id; if (k) sysCountByOwner[k] = (sysCountByOwner[k] || 0) + 1; });
    const withSys = users.map(u => ({ ...u, systems: sysCountByOwner[u.id] || 0 }));
    const withPlanFull = withSys.filter(u => (Number(u.protectionTier) || 0) > 0 || (Number(u.contractTier) || 0) > 0);
    const othersFull = withSys.filter(u => !withPlanFull.includes(u));
    return `<p class="muted small" style="margin:0 0 12px">Everyone with a subscription or contract, plus every registered system on the marketplace. Click a user to see their profile, plans, revenue, and systems — pause, unregister, or restrict a system with a note the owner sees.</p>
    ${revokesBlock}
    <div class="section-head" style="margin-bottom:10px"><div><h2 style="font-size:19px">Subscribers <span class="muted small" style="font-weight:400">(${withPlanFull.length})</span></h2></div></div>
    <div class="table-wrap"><table class="table">
      <thead><tr><th>User</th><th>Role</th><th>Plans</th><th>Systems</th><th></th></tr></thead>
      <tbody>${withPlanFull.length ? withPlanFull.map(subRow).join('') : `<tr><td colspan="5"><div class="empty">No subscribers yet.</div></td></tr>`}</tbody></table></div>
    <div class="section-head" style="margin:18px 0 10px"><div><h2 style="font-size:19px">All registered systems <span class="muted small" style="font-weight:400">(${systems.length})</span></h2></div></div>
    <div class="table-wrap"><table class="table">
      <thead><tr><th>System</th><th>Owner</th><th>Status</th><th>Games</th><th>Devices</th><th>Registered</th><th>Last seen</th><th></th></tr></thead>
      <tbody>${systems.map(s => `<tr>
        <td><b>${esc(s.name)}</b>${s.staffNote ? ` <span class="badge warn" title="${esc(s.staffNote)}">note</span>` : ''}</td>
        <td>${s.owner ? `<a href="#/profile/${esc(s.owner.handle)}">${esc(s.owner.displayName)}</a>` : '—'}</td>
        <td>${s.status === 'active' ? '<span class="badge ok">ACTIVE</span>' : '<span class="badge plain">PAUSED</span>'}</td>
        <td>${s.games}</td><td>${s.devices}</td>
        <td class="muted">${fmtDate(s.createdAt)}</td>
        <td class="muted">${s.lastSeenAt ? timeAgo(s.lastSeenAt) : 'never'}</td>
        <td><button class="btn btn-ghost btn-sm" onclick="STATE.adminSys='${s.id}';STATE.adminSub=null;router()">${ICON.eye} Open</button></td>
      </tr>`).join('') || `<tr><td colspan="8"><div class="empty">No systems registered yet.</div></td></tr>`}</tbody></table></div>
    <div class="section-head" style="margin:18px 0 10px"><div><h2 style="font-size:19px">Other users <span class="muted small" style="font-weight:400">(${othersFull.length})</span></h2></div></div>
    <div class="table-wrap"><table class="table">
      <thead><tr><th>User</th><th>Role</th><th>Plans</th><th>Systems</th><th></th></tr></thead>
      <tbody>${othersFull.length ? othersFull.map(subRow).join('') : `<tr><td colspan="5"><div class="empty">No other users.</div></td></tr>`}</tbody></table></div>`;
  }
  if (tab === 'support') {
    const r = await API.adminListTickets(STATE.user);
    const list = r.ok ? r.data : [];
    const ticketRow = t => `<tr>
      <td><b>${esc(t.subject)}</b><div class="muted small">${esc(t.category || 'General')}</div></td>
      <td><a href="#/profile/${esc(t.user.handle)}">${esc(t.user.displayName)}</a> ${badgeHtml(t.user.role, t.user.tags, t.user)}</td>
      <td><span class="badge ${t.status === 'open' ? 'warn' : 'plain'}">${esc(t.status)}</span></td>
      <td class="muted">${timeAgo(t.lastActivityAt)}</td>
      <td>${fmtDate(t.createdAt)}</td>
      <td><div class="row-actions"><a class="btn btn-ghost btn-sm" href="#/ticket/${esc(t.id)}">${ICON.mail} View</a><button class="btn btn-danger btn-sm" onclick="onAdminDeleteTicket('${t.id}')">${ICON.trash}</button></div></td>
    </tr>`;
    return `<p class="muted small mb">Support tickets created by users. Closed tickets keep a full transcript log. ${list.length} ticket${list.length === 1 ? '' : 's'} total.</p>
      ${await adminFaqEditorHtml()}
      <h3 style="font-family:var(--font-display);font-size:17px;margin:18px 0 10px">Tickets</h3>
      <div class="table-wrap"><table class="table">
        <thead><tr><th>Subject</th><th>User</th><th>Status</th><th>Last activity</th><th>Created</th><th></th></tr></thead>
        <tbody>${list.length ? list.map(ticketRow).join('') : `<tr><td colspan="6"><div class="empty">No tickets yet.</div></td></tr>`}</tbody></table></div>`;
  }
  if (tab === 'approvals') {
    const [p, r] = await Promise.all([API.adminPending(STATE.user), API.adminRejected(STATE.user)]);
    const pend = p.ok ? p.data : [];
    const rej = r.ok ? r.data : [];
    return `<h3 style="font-family:var(--font-display);font-size:17px;margin-bottom:14px">Pending submissions (${pend.length})</h3>
      ${pend.length ? pend.map(a => `
        <div class="approve-card mb">
          <div class="thumb">${thumbHtml(a, 26)}</div>
          <div class="info">
            <h4>${esc(a.title)} <span class="muted small" style="font-weight:400">· ${fmtMoney(a.price)}</span></h4>
            <div class="muted small mb">by ${a.owner ? `<a href="#/profile/${esc(a.owner.handle)}">${esc(a.owner.displayName)}</a> ${badgeHtml(a.owner.role, a.owner.tags)}` : '<span class="muted">Unknown (deleted user)</span>'} · ${catBadge(a.category)} · posted ${timeAgo(a.createdAt)}</div>
            <div class="desc">${esc(a.description)}</div>
            <div class="muted small mt">File: <span class="mono">${esc(a.fileName)}</span></div>
          </div>
          <div class="row" style="gap:8px;flex-wrap:wrap">
            <button class="btn btn-ghost btn-sm" onclick="onAdminDownload('${a.id}')">${ICON.download} File</button>
            <button class="btn btn-ghost btn-sm" onclick="onAdminReject('${a.id}')">Reject</button>
            <button class="btn btn-primary btn-sm" onclick="onAdminApprove('${a.id}')">${ICON.check} Approve</button>
          </div></div>`).join('')
      : emptyHtml('Queue is clear', 'No assets are waiting for approval.')}
      <h3 class="mt2" style="font-family:var(--font-display);font-size:17px;margin-bottom:14px">Rejected submissions (${rej.length})</h3>
      ${rej.length ? rej.map(a => `<div class="approve-card mb"><div class="thumb">${thumbHtml(a, 26)}</div><div class="info"><h4>${esc(a.title)}</h4><div class="muted small mb">by ${a.owner ? `<a href="#/profile/${esc(a.owner.handle)}">${esc(a.owner.displayName)}</a>` : '<span class="muted">Unknown (deleted user)</span>'} · ${timeAgo(a.createdAt)}</div><div class="desc" style="color:var(--text-2)">${esc(a.rejectReason)}</div></div></div>`).join('')
      : `<p class="muted small">No rejected submissions.</p>`}`;
  }
  if (tab === 'assets') {
    const r = await API.adminAssets(STATE.user);
    const list = r.ok ? r.data : [];
    const canHardDelete = effRank(STATE.user) >= roleRank('cofounder');
    return `<div class="table-wrap"><table class="table">
      <thead><tr><th>Asset</th><th>Owner</th><th>Category</th><th>Price</th><th>Sales</th><th>Status</th><th></th></tr></thead>
      <tbody>${list.map(a => {
        const owner = a.owner || null;
        const ownerCell = owner
          ? `<a href="#/profile/${esc(owner.handle)}">${esc(owner.displayName)}</a>`
          : '<span class="muted small">Unknown (deleted user)</span>';
        return `<tr>
        <td><div class="row" style="gap:10px"><span style="width:34px;height:26px;border-radius:6px;overflow:hidden;position:relative;flex-shrink:0;border:1px solid var(--border)">${thumbHtml(a, 14)}</span><a href="#/asset/${a.id}" class="bold">${esc(a.title)}</a></div></td>
        <td>${ownerCell}</td>
        <td>${CAT_LABEL[a.category] || esc(a.category)}</td><td>${fmtMoney(a.price)}</td><td>${a.sales}</td><td>${statusBadge(a.status, a.rejectReason)}</td>
        <td><div class="row-actions"><button class="btn btn-ghost btn-sm" title="Get a copy of the file" onclick="onAdminDownload('${a.id}')">${ICON.download}</button>${canHardDelete ? `<button class="btn btn-danger btn-sm" title="Permanently delete this post" onclick="onAdminDeleteAsset('${a.id}')">${ICON.trash} Delete</button>` : ''}${a.status === 'approved' ? `<button class="btn btn-danger btn-sm" title="Temporarily hide this post from the shop" onclick="onAdminDisableAsset('${a.id}')">${ICON.ban} Disable</button>` : a.status === 'disabled' ? `<button class="btn btn-ghost btn-sm" title="Restore the post to the shop" onclick="onAdminRestoreAsset('${a.id}')">${ICON.check} Restore</button>` : ''}</div></td>
      </tr>`;
      }).join('') || `<tr><td colspan="7"><div class="empty">No assets.</div></td></tr>`}</tbody></table></div>`;
  }
  if (tab === 'users') {
    const r = await API.adminUsers(STATE.user);
    const list = r.ok ? r.data : [];
    STATE._adminUsers = list;
    return `<div class="table-wrap"><table class="table">
      <thead><tr><th>User</th><th>Email</th><th>Role</th><th>Status</th><th>Moderation</th></tr></thead>
      <tbody>${list.map(u => {
        const isStaffUser = roleRank(u.role) >= roleRank('admin');
        const canGrantAll = effRank(STATE.user) >= roleRank('cofounder');
        const isMe = u.id === STATE.user.id;
        const canManage = !isMe && (canGrantAll ? true : !isStaffUser);
        const status = u.banned ? `<span class="status-pill status-rejected">Banned${u.banReason ? ' — ' + esc(u.banReason) : ''}</span>`
          : u.timeoutUntil && u.timeoutUntil > now() ? `<span class="status-pill status-pending">Timed out (${esc(timeoutText(u))})</span>`
          : u.restrictedUntil && u.restrictedUntil > now() ? `<span class="status-pill status-pending" title="${esc(u.restrictReason || '')}">Restricted (${esc(timeoutText({ timeoutUntil: u.restrictedUntil }))})</span>`
          : u.unsubscribed ? '<span class="status-pill status-pending">Unsubscribed</span>'
          : '<span class="status-pill status-approved">Active</span>';
        const hasPlan = (Number(u.protectionTier) || 0) > 0 || (Number(u.contractTier) || 0) > 0;
        const actions = isStaffUser
          ? `<span class="muted small">${ICON.shield} Protected — staff cannot be moderated</span>`
          : `<div class="row-actions">
              ${u.banned ? `<button class="btn btn-ghost btn-sm" onclick="onAdminUnban('${u.id}')">Unban</button>` : `<button class="btn btn-danger btn-sm" onclick="onAdminBan('${u.id}')">${ICON.ban} Ban</button>`}
              ${u.timeoutUntil && u.timeoutUntil > now() ? `<button class="btn btn-ghost btn-sm" onclick="onAdminClear('${u.id}')">Clear timeout</button>` : `<button class="btn btn-ghost btn-sm" onclick="onAdminTimeout('${u.id}')">${ICON.clock} Timeout</button>`}
              ${u.restrictedUntil && u.restrictedUntil > now() ? `<button class="btn btn-ghost btn-sm" onclick="onAdminRestrict('${u.id}', false)">Unrestrict</button>` : `<button class="btn btn-ghost btn-sm" onclick="onAdminRestrict('${u.id}', true)">${ICON.shield} Restrict</button>`}
              ${hasPlan ? `<button class="btn btn-ghost btn-sm" title="Request to lift their Subscription + Contract (needs Co-Founder / Founder approval)" onclick="onAdminSubRevoke('${u.id}')">Revoke subscription</button>
              ${canGrantAll ? `<button class="btn btn-ghost btn-sm" title="Set their plan tiers to zero (immediate)" onclick="onAdminUnsubscribePlan('${u.id}')">Unsubscribe</button>` : ''}` : ''}
              ${canGrantAll ? `<button class="btn btn-ghost btn-sm" title="Set their Subscription / Contract tiers (0–3)" onclick="onAdminSetPlan('${u.id}')">${ICON.key} Plans</button>` : ''}
              ${canGrantAll && u.role === 'member' ? `<button class="btn btn-ghost btn-sm" style="border-color:rgba(212,175,55,.4)" title="Grant VIP — complimentary access to the studio's own systems + Subscription-1 limits" onclick="onAdminSetVip('${u.id}', true)">${ICON.crown} Grant VIP</button>` : ''}
              ${canGrantAll && u.role === 'vip' ? `<button class="btn btn-ghost btn-sm" style="border-color:rgba(212,175,55,.4)" title="Remove VIP (back to Verified)" onclick="onAdminSetVip('${u.id}', false)">${ICON.crown} Remove VIP</button>` : ''}
            </div>`;
        const roleCell = isMe ? badgeHtml(u.role, u.tags) + ' <span class="muted small">(you)</span>'
          : !canManage ? badgeHtml(u.role, u.tags) + ' <span class="muted small">Protected</span>'
          : canGrantAll ? `<select class="select" style="width:auto;padding:6px 30px 6px 10px;font-size:12.5px;border-radius:8px" onchange="onAdminRole('${u.id}', this.value)" title="Change role">${UI_ROLES.map(r => `<option value="${r}" ${u.role === r ? 'selected' : ''}>${ROLE_LABEL_UI[r]}</option>`).join('')}</select>`
          : badgeHtml(u.role, u.tags) + ' <span class="muted small">Founder sets roles</span>';
        return `<tr>
          <td><div class="user-row">${avatarHtml(u, 34)}<div><a class="bold" href="#/profile/${esc(u.handle)}">${esc(u.displayName)}</a><div class="muted small">@${esc(u.handle)} ${badgeHtml(u.role, u.tags)}</div></div></div></td>
          <td class="muted">${esc(u.email)}</td>
          <td>${roleCell}</td>
          <td>${status}</td>
          <td>${actions}</td></tr>`;
      }).join('')}</tbody></table></div>`;
  }
  if (tab === 'reports') {
    const r = await API.adminReports(STATE.user);
    if (!r.ok) return `<p class="form-error">${esc(r.error)}</p>`;
    const { open, resolved } = r.data;
    const card = rep => {
      let title = '', ctx = '';
      if (rep.targetType === 'asset') {
        title = `Asset: ${rep.asset ? rep.asset.title : '(deleted)'}`;
        ctx = rep.asset ? `<a class="btn btn-ghost btn-sm" href="#/asset/${rep.asset.id}">${ICON.eye} View</a><button class="btn btn-danger btn-sm" onclick="onAdminDelete('${rep.asset.id}')">${ICON.trash} Delete post</button>` : '';
      } else if (rep.targetType === 'comment') {
        title = `Comment: “${rep.comment ? rep.comment.body.slice(0, 70) : '(deleted)'}”`;
        ctx = `<span class="muted small">on ${rep.comment && rep.comment.assetTitle ? esc(rep.comment.assetTitle) : 'a deleted asset'}</span>`;

        <div class="row" style="gap:8px">${actions}</div></div>`;

        <p class="muted small mb">Send a branded email to selected users — the dark/gold template is applied automatically, from <b style="color:var(--text)">Kings Production &lt;no-reply@kingsproduction.cc&gt;</b>. Unsubscribed users are always skipped automatically.</p>
        <div class="field"><label>Recipients<span class="req">*</span></label>
          <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
            <button type="button" class="btn btn-sm mailbox-blast-all ${!STATE._blastSel || !STATE._blastSel.length ? 'btn-primary' : 'btn-ghost'}" onclick="onBlastToggleAll(this)">${ICON.crown} Everyone</button>
            <span class="muted small">or pick specific users (👁 opens their send history):</span>
          </div>
          <div class="mt" style="display:flex;flex-wrap:wrap;gap:8px;max-height:150px;overflow:auto">${(STATE._blastUsers || []).map(u => chipBtn(u)).join('')}</div>
        </div>

          <div class="field" style="flex:1;min-width:220px"><label>Subject<span class="req">*</span></label><input class="input" id="blast-subject" maxlength="120" placeholder="e.g. New update is live!"></div>
          <div class="field" style="min-width:220px"><label>Schedule (optional)</label>
            <div class="row" style="gap:8px">
              <input class="input" id="blast-schedule" readonly placeholder="Pick a date & time…" onclick="openBlastPicker()">

            </div>
            <div class="hint">Click the box to pick from a calendar. Leave empty to send now.</div></div>

        <div class="field"><label>Message<span class="req">*</span></label><textarea class="input" id="blast-body" rows="5" maxlength="2000" placeholder="Write the main content — the branded template wraps it automatically."></textarea></div>

          <button class="btn btn-ghost" id="blast-draft-btn" onclick="onAdminSaveDraft()">${ICON.edit} Save as draft</button>
          <span class="muted small">Emails go out instantly through Brevo SMTP (or at the scheduled time).</span>
        </div>
      </div>
      ${drafts.length ? `<h3 style="font-family:var(--font-display);font-size:15px;margin:18px 0 10px">Drafts (${drafts.length})</h3>
      <div class="card" style="padding:6px 0">${drafts.map(b => blastRow(b, ICON.edit, 'Draft', `<button class="btn btn-ghost btn-sm" onclick="onBlastLoad('${b.id}')">${ICON.edit} Edit</button><button class="btn btn-danger btn-sm" onclick="onBlastDelete('${b.id}')">${ICON.trash}</button>`)).join('')}</div>` : ''}
      ${scheduled.length ? `<h3 style="font-family:var(--font-display);font-size:15px;margin:18px 0 10px">Scheduled (${scheduled.length})</h3>
      <div class="card" style="padding:6px 0">${scheduled.map(b => blastRow(b, ICON.clock, 'Scheduled · ' + fmtDate(b.scheduledFor), `<button class="btn btn-danger btn-sm" onclick="onBlastDelete('${b.id}')">${ICON.trash}</button>`)).join('')}</div>` : ''}
      ${inbound.length ? `<h3 style="font-family:var(--font-display);font-size:15px;margin:18px 0 10px">Replies &amp; events (${inbound.length})</h3>
      <div class="card" style="padding:6px 0">${inbound.map(e => `<div style="padding:14px 20px;border-bottom:1px solid var(--border)">
          <div class="row" style="justify-content:space-between;gap:10px"><div><b>${esc(e.event)}</b> <span class="muted small">· ${esc(e.email)}</span>${e.subject ? ` · ${esc(e.subject)}` : ''}</div><span class="muted small">${timeAgo(e.createdAt)}</span></div>
          ${e.body ? `<p class="muted small mt">${esc(e.body)}</p>` : ''}${e.detail ? `<p class="muted small">${esc(e.detail)}</p>` : ''}
        </div>`).join('')}</div>` : ''}
      <h3 style="font-family:var(--font-display);font-size:15px;margin:18px 0 10px">Sent mail log</h3>
      ${list.length ? `<div class="card" style="padding:6px 0">${list.map(e => `
        <div style="padding:16px 20px;border-bottom:1px solid var(--border)">
          <div class="row" style="justify-content:space-between;gap:10px"><div><b>${esc(e.subject)}</b> <span class="muted small">· to ${esc(e.to)}</span></div><span class="muted small">${timeAgo(e.createdAt)}</span></div>
          <p class="muted small mt">${esc(e.body)}</p>
          ${e.link ? `<a class="btn btn-ghost btn-sm mt" href="${esc(e.link)}">${ICON.key} Open reset link</a>` : ''}
        </div>`).join('')}</div>` : emptyHtml('No sent mail yet', 'Emails you send will appear here.')}`;
  }
  return '';
}

/* ---- admin actions ---- */
async function onAdminCreateAnnounce(e) {
  e.preventDefault();
  const f = e.target;
  const r = await API.createAnnouncement(STATE.user, { title: f.title.value, body: f.body.value, link: f.link.value, style: f.style.value });
  if (!r.ok) { toast(r.error, 'err'); return; }
  toast('Announcement published — it is live across the site now.');
  SFX.play('crown');
  renderAnnouncement();
  await router();
}
async function onAdminToggleAnnounce(id, active) {
  const r = await API.updateAnnouncement(STATE.user, id, { active });
  r.ok ? (toast(active ? 'Announcement is now live.' : 'Announcement hidden.'), renderAnnouncement(), await router()) : toast(r.error, 'err');
}
function onAdminEditAnnounce(id) {
  const ov = modal({
    title: 'Edit announcement', confirmLabel: 'Save',
    body: `<div class="field"><label>Title</label><input class="input" id="an-title" required></div>
      <div class="field"><label>Body</label><input class="input" id="an-body" required></div>
      <div class="field"><label>Link (optional)</label><input class="input" id="an-link" placeholder="https://…"></div>`,
    validate: async o => {
      const title = o.querySelector('#an-title').value.trim();
      const body = o.querySelector('#an-body').value.trim();
      if (title.length < 3 || body.length < 3) { toast('Title and body are required.', 'err'); return false; }
      const r = await API.updateAnnouncement(STATE.user, id, { title, body, link: o.querySelector('#an-link').value.trim() });

}
async function onAdminDeleteAnnounce(id) {

    onConfirm: async () => { const r = await API.deleteAnnouncement(STATE.user, id); r.ok ? (toast('Announcement deleted.'), renderAnnouncement(), await router()) : toast(r.error, 'err'); } });
}
/* ---- bulk email blast ---- */
function blastFormValues() {
  return {
    subject: (document.getElementById('blast-subject') || {}).value || '',
    body: (document.getElementById('blast-body') || {}).value || '',
    schedule: STATE._blastSchedule || '',
  };
}
/* ---- calendar GUI for the schedule field ---- */
function scheduleField() { return document.getElementById('blast-schedule'); }
function syncScheduleField() {
  const f = scheduleField();
  if (!f) return;
  f.value = STATE._blastSchedule ? fmtDateFull(STATE._blastSchedule) + ' · ' + new Date(STATE._blastSchedule).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
  const clearBtn = f.parentNode.querySelector('button');
  if (clearBtn) clearBtn.style.display = STATE._blastSchedule ? '' : 'none';
}
function clearBlastSchedule() { STATE._blastSchedule = 0; syncScheduleField(); rerenderBlastBtn(); }
function openBlastPicker() {
  const cur = STATE._blastSchedule || Date.now() + 36e5;
  let d = new Date(cur);
  let viewY = d.getFullYear(), viewM = d.getMonth();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const fmtSel = () => fmtDateFull(new Date(viewY, viewM, d.getDate()).getTime()) + ' · ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const hour12 = h => ((h + 11) % 12) + 1;
  function render() {
    const first = new Date(viewY, viewM, 1);
    const startDow = first.getDay();
    const days = new Date(viewY, viewM + 1, 0).getDate();
    let cells = '';
    for (let i = 0; i < startDow; i++) cells += '<div></div>';
    for (let day = 1; day <= days; day++) {
      const sel = day === d.getDate() && viewM === d.getMonth() && viewY === d.getFullYear();
      cells += `<button type="button" class="picker-day ${sel ? 'picker-day-sel' : ''}" data-day="${day}">${day}</button>`;
    }
    const hours = [];
    for (let h = 0; h < 24; h++) {
      const hh = String(hour12(h)).padStart(2, '0');
      hours.push(`<button type="button" class="picker-hr ${h === d.getHours() ? 'picker-day-sel' : ''}" data-hr="${h}">${hh}${h < 12 ? 'am' : 'pm'}</button>`);
    }
    overlay.querySelector('#pk-body').innerHTML = `
      <div class="picker-head"><button type="button" class="btn btn-ghost btn-sm" data-m="-1">‹</button>
        <b>${MO[viewM]} ${viewY}</b>
        <button type="button" class="btn btn-ghost btn-sm" data-m="1">›</button></div>
      <div class="picker-grid">${['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(x => `<div class="picker-dow">${x}</div>`).join('')}${cells}</div>
      <div class="picker-time"><b>Time</b><div class="picker-hrs">${hours.join('')}</div></div>
      <div class="picker-preview">${fmtSel()}</div>
      <div class="row" style="gap:8px;margin-top:12px;flex-wrap:wrap">
        <button type="button" class="btn btn-ghost btn-sm" data-q="3600e3">+1 hour</button>
        <button type="button" class="btn btn-ghost btn-sm" data-q="24*3600e3">Tomorrow</button>
        <button type="button" class="btn btn-ghost btn-sm" data-q="7*24*3600e3">+1 week</button>
        <button type="button" class="btn btn-ghost btn-sm" data-clear>Clear</button>
      </div>`;
    overlay.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { viewM += Number(b.dataset.m); if (viewM < 0) { viewM = 11; viewY--; } if (viewM > 11) { viewM = 0; viewY++; } render(); });
    overlay.querySelectorAll('.picker-day').forEach(b => b.onclick = () => { d.setDate(Number(b.dataset.day)); d.setMonth(viewM); d.setFullYear(viewY); render(); });
    overlay.querySelectorAll('.picker-hr').forEach(b => b.onclick = () => { d.setHours(Number(b.dataset.hr)); render(); });
    const QS = { '3600e3': 36e5, '24*3600e3': 24 * 36e5, '7*24*3600e3': 7 * 24 * 36e5 };
    overlay.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { d = new Date(Date.now() + (QS[b.dataset.q] || 36e5)); viewY = d.getFullYear(); viewM = d.getMonth(); render(); });
    overlay.querySelector('[data-clear]').onclick = () => { STATE._blastSchedule = 0; syncScheduleField(); overlay.remove(); rerenderBlastBtn(); };
  }
  overlay.innerHTML = `<div class="modal" role="dialog" aria-modal="true" style="max-width:380px">
    <h3>${ICON.clock} Schedule blast</h3>
    <div class="modal-body" id="pk-body"></div>
    <div class="modal-actions"><button class="btn btn-ghost btn-sm" data-act="cancel">Cancel</button>
    <button class="btn btn-primary btn-sm" data-act="ok">${ICON.check} Set schedule</button></div></div>`;
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  overlay.querySelector('[data-act=cancel]').onclick = () => overlay.remove();
  overlay.querySelector('[data-act=ok]').onclick = () => {
    STATE._blastSchedule = d.getTime();
    syncScheduleField();
    rerenderBlastBtn();
    overlay.remove();
  };
  document.body.appendChild(overlay);
  render();
}
async function onAdminSendBlast() {
  const { subject, body, schedule } = blastFormValues();
  if (!subject.trim() || !body.trim()) { toast('Subject and message are required.', 'err'); return; }
  const sel = STATE._blastSel && STATE._blastSel.length ? STATE._blastSel : null;
  const scope = sel ? sel.length + ' user' + (sel.length > 1 ? 's' : '') : 'every user';
  const when = schedule ? new Date(schedule).getTime() : 0;
  if (when && when <= Date.now()) { toast('Schedule time must be in the future.', 'err'); return; }
  const action = when ? `schedule this for <b>${esc(fmtDateFull(when))}</b> and email <b>${esc(scope)}</b>` : `instantly email <b>${esc(scope)}</b>`;
  modal({ title: when ? `Schedule for ${scope}?` : `Send to ${scope}?`, confirmLabel: when ? 'Schedule' : 'Send', danger: true, body: `<p>This will ${action} from <b>Kings Production &lt;no-reply@kingsproduction.cc&gt;</b> with subject <b>“${esc(subject)}”</b>. Unsubscribed users are skipped. There is no undo.</p>`,
    onConfirm: async () => {
      const r = await API.adminSendEmail(STATE.user, { userIds: sel, subject: subject.trim(), body: body.trim(), scheduleAt: when || undefined });
      if (!r.ok) { toast(r.error, 'err'); return false; }
      SFX.play('crown');
      if (r.data.saved) toast(when ? `Scheduled — fires ${fmtDateFull(when)}.` : 'Draft saved.');
      else toast(`Email sent to ${r.data.sent} recipient${r.data.sent === 1 ? '' : 's'}.`);
      await router();
      return true;
    } });
}
async function onAdminSaveDraft() {
  const { subject, body } = blastFormValues();
  if (!subject.trim() || !body.trim()) { toast('Subject and message are required to save a draft.', 'err'); return; }
  const sel = STATE._blastSel && STATE._blastSel.length ? STATE._blastSel : null;
  const r = await API.adminSendEmail(STATE.user, { userIds: sel, subject: subject.trim(), body: body.trim(), draft: true });
  if (!r.ok) { toast(r.error, 'err'); return; }
  toast('Draft saved — you can edit or send it from the drafts list below.');
  await router();
}
async function onBlastLoad(id) {
  const br = await API.adminListBlasts(STATE.user);
  const b = br.ok && br.data.find(x => x.id === id);
  if (!b) { toast('Draft not found.', 'err'); return; }
  let recipients = [];
  try { recipients = JSON.parse(b.recipients || '[]'); } catch (e) {}
  STATE._blastSel = recipients;
  const s = document.getElementById('blast-subject'); if (s) s.value = b.subject;
  const bo = document.getElementById('blast-body'); if (bo) bo.value = b.body;
  const sc = document.getElementById('blast-schedule'); if (sc) sc.value = '';
  rerenderBlastBtn();
  document.querySelectorAll('.blast-chip').forEach(c => c.classList.toggle('btn-primary', STATE._blastSel.includes(c.dataset.uid)));
  const allBtn = document.querySelector('.mailbox-blast-all');
  if (allBtn && !STATE._blastSel.length) allBtn.classList.add('btn-primary');
  toast('Draft loaded — review and send it.');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
async function onBlastDelete(id) {
  modal({ title: 'Delete this blast?', danger: true, confirmLabel: 'Delete', body: '<p>Removes the draft or scheduled email permanently.</p>',
    onConfirm: async () => { const r = await API.adminDeleteBlast(STATE.user, id); r.ok ? (toast('Blast deleted.'), await router()) : toast(r.error, 'err'); } });
}
async function onAdminUserHistory(userId) {
  const r = await API.adminEmailHistory(STATE.user, userId);
  if (!r.ok) { toast(r.error, 'err'); return; }
  const d = r.data;
  const rows = d.emails.length ? d.emails.map(e => `<div style="padding:12px 0;border-bottom:1px solid var(--border)"><b>${esc(e.subject)}</b> <span class="muted small">· ${timeAgo(e.createdAt)}</span><p class="muted small mt">${esc(e.body.slice(0, 140))}</p></div>`).join('') : '<p class="muted small">No emails sent to this user yet.</p>';

  });
}

/* ---- loading screen + boot ---- */
function runLoaderProgress() {
  const fill = document.getElementById('loader-fill');
  const pct = document.getElementById('loader-pct');
  if (!fill) return;
  const start = performance.now(), dur = 1400;
  function tick(t) {
    const p = Math.min(1, (t - start) / dur);
    const v = Math.round((1 - Math.pow(1 - p, 3)) * 92);
    fill.style.width = v + '%';
    if (pct) pct.textContent = v + '%';
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
function finishLoader() {
  const l = document.getElementById('loader');
  if (!l) return;
  const fill = document.getElementById('loader-fill');
  const pct = document.getElementById('loader-pct');
  if (fill) fill.style.width = '100%';
  if (pct) pct.textContent = '100%';
  l.classList.add('done');
  setTimeout(() => l.remove(), 700);
}

/* ---- interactive effects: cursor glow + card tilt ---- */
function setupWow() {
  const fine = window.matchMedia('(hover:hover) and (pointer:fine)').matches;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!fine || reduce) return;
  const glow = document.createElement('div');
  glow.className = 'cursor-glow';
  document.body.appendChild(glow);
  let x = innerWidth / 2, y = innerHeight / 2, tx = x, ty = y, raf = null;
  document.addEventListener('mousemove', e => {
    tx = e.clientX; ty = e.clientY;
    glow.classList.add('on');
    if (!raf) raf = requestAnimationFrame(loop);
  }, { passive: true });
  document.addEventListener('mouseleave', () => glow.classList.remove('on'));
  function loop() {
    x += (tx - x) * 0.13; y += (ty - y) * 0.13;
    glow.style.transform = `translate(${x - 260}px, ${y - 260}px)`;
    if (Math.abs(tx - x) > 0.5 || Math.abs(ty - y) > 0.5) raf = requestAnimationFrame(loop);
    else { raf = null; glow.classList.remove('on'); }
  }
  const TILT = '.asset-card, .project-card, .creator-card';
  document.addEventListener('mousemove', e => {
    const card = e.target.closest(TILT);
    if (!card) return;
    const r = card.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width - 0.5;
    const py = (e.clientY - r.top) / r.height - 0.5;
    card.style.setProperty('--rx', (-py * 4).toFixed(2) + 'deg');
    card.style.setProperty('--ry', (px * 5).toFixed(2) + 'deg');
    card.style.setProperty('--ty', '-5px');
  }, { passive: true });
  document.addEventListener('mouseout', e => {
    const card = e.target.closest(TILT);
    if (card) { card.style.setProperty('--rx', '0deg'); card.style.setProperty('--ry', '0deg'); card.style.setProperty('--ty', '-4px'); }
  });
}

/* ---- scroll reveals (only when JS + motion are OK) ---- */
let _revealIO = null;
function setupReveal() {
  if (!('IntersectionObserver' in window) || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.body.classList.add('js-reveal');
  _revealIO = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('in'); _revealIO.unobserve(e.target); }
  }), { threshold: 0.06 });
  bindReveals();
}
function bindReveals() {
  if (!_revealIO) return;
  document.querySelectorAll('.section-head, .profile-hero, .tier, .approve-card, .creator-card, .asset-card, .project-card').forEach(el => {
    if (!el.classList.contains('in') && !el.dataset.revealed) { el.dataset.revealed = '1'; _revealIO.observe(el); }
  });
}

/* ---- hero particles + stat counters ---- */
function spawnParticles() {
  const host = document.querySelector('.hero-particles');
  if (!host || host.childElementCount) return;
  const n = Math.min(22, Math.max(10, Math.floor(innerWidth / 80)));
  for (let i = 0; i < n; i++) {
    const s = document.createElement('span');
    s.className = 'particle';
    const size = 2 + Math.random() * 4;
    s.style.cssText = `left:${Math.random() * 100}%;width:${size}px;height:${size}px;animation-duration:${7 + Math.random() * 9}s;animation-delay:${Math.random() * 8}s;opacity:${0.3 + Math.random() * 0.6}`;
    host.appendChild(s);
  }
}
function countUp(el, target) {
  if (!el) return;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const t = Number(target) || 0;
  if (reduce) { el.textContent = t.toLocaleString(); return; }
  const start = performance.now(), dur = 900;
  function tick(nowMs) {
    const p = Math.min(1, (nowMs - start) / dur);
    el.textContent = Math.round(t * (1 - Math.pow(1 - p, 3))).toLocaleString();
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

/* ---- site status: awake vs asleep (Render free tier sleeps when idle) ---- */
function startStatusPinger() {
  const el = document.getElementById('site-status');
  const txt = document.getElementById('site-status-txt');
  if (!el) return;
  async function ping() {
    const t0 = performance.now();
    let state = 'asleep';
    try {
      const ctrl = new AbortController();
      const to = setTimeout(() => ctrl.abort(), 4000);
      const res = await fetch('/api/health', { signal: ctrl.signal, cache: 'no-store' });
      clearTimeout(to);
      if (res.ok) state = (performance.now() - t0) > 1500 ? 'waking' : 'online';
    } catch (e) { state = 'asleep'; }
    el.className = 'site-status ' + state;
    if (txt) txt.textContent = state === 'online' ? 'Online · Ready' : state === 'waking' ? 'Waking up…' : 'Asleep · cold start on visit';
  }
  ping();
  setInterval(ping, 20000);
}

/* ---- scroll progress bar + back-to-top ---- */
function setupScrollFx() {
  const bar = document.createElement('div');
  bar.className = 'scroll-progress';
  bar.setAttribute('aria-hidden', 'true');
  document.body.appendChild(bar);
  const topBtn = document.createElement('button');
  topBtn.className = 'to-top';
  topBtn.setAttribute('aria-label', 'Back to top');
  topBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m0 0-5 5m5-5 5 5"/></svg>';
  topBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }));
  document.body.appendChild(topBtn);
  let ticking = false;
  const onScroll = () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      const h = document.documentElement;
      const max = h.scrollHeight - h.clientHeight;
      bar.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%';
      topBtn.classList.toggle('show', h.scrollTop > 480);
      ticking = false;
    });
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
}

/* ---- ambient gold dust across the whole site ---- */
function setupDust() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const host = document.createElement('div');
  host.className = 'ambient-dust';
  host.setAttribute('aria-hidden', 'true');
  document.body.appendChild(host);
  const n = Math.min(26, Math.max(10, Math.floor(innerWidth / 70)));
  for (let i = 0; i < n; i++) {
    const m = document.createElement('span');
    m.className = 'dust-mote';
    const size = 1.5 + Math.random() * 3;
    m.style.cssText = `left:${Math.random() * 100}%;width:${size}px;height:${size}px;animation-duration:${14 + Math.random() * 16}s;animation-delay:${-Math.random() * 26}s`;
    host.appendChild(m);
  }
}

/* ---- sound feedback for interactive elements ---- */
function setupSounds() {
  document.addEventListener('click', e => {
    const t = e.target.closest('button, a, .chip, .tab, input[type=checkbox], input[type=radio], select');
    if (!t) return;
    if (e.target.closest('.like-btn')) return; // likes play their own dedicated sound
    SFX.play(t.matches('input[type=checkbox],input[type=radio]') ? 'toggle' : 'click');
  }, { passive: true });
}

/* ---- click particle burst ---- */
function setupClickBurst() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.addEventListener('click', e => {
    if (e.target.closest('.like-btn')) return; // likes get their own bigger burst
    if (e.target.closest('a,button,input,select,textarea,label,.chip,.tab,.pm-card,.star-btn')) burstAt(e.clientX, e.clientY, 5);
    else burstAt(e.clientX, e.clientY, 8);
  }, { passive: true });
}
function burstAt(x, y, n = 10) {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const host = document.createElement('div');
  host.className = 'fx-burst';
  host.style.transform = `translate(${x}px, ${y}px)`;
  document.body.appendChild(host);
  const colors = ['#ffd97a', '#e8c96a', '#ffffff', '#d4af37'];
  for (let i = 0; i < n; i++) {
    const p = document.createElement('span');
    p.className = 'fx-particle';
    const ang = Math.random() * Math.PI * 2, dist = 24 + Math.random() * 46;
    const size = 2.5 + Math.random() * 4.5;
    p.style.cssText = `--dx:${Math.cos(ang) * dist}px;--dy:${Math.sin(ang) * dist}px;left:0;top:0;width:${size}px;height:${size}px;background:${colors[(Math.random() * colors.length) | 0]};box-shadow:0 0 ${4 + Math.random() * 8}px rgba(212,175,55,.8)`;
    host.appendChild(p);
  }
  setTimeout(() => host.remove(), 820);
}

/* ---- cursor sparkle trail ---- */
function setupSparkleTrail() {
  if (!window.matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let last = 0;
  document.addEventListener('mousemove', e => {
    const t = performance.now();
    if (t - last < 55) return;
    last = t;
    const s = document.createElement('span');
    s.className = 'fx-sparkle';
    s.textContent = '✦';
    s.style.cssText = `left:${e.clientX}px;top:${e.clientY}px;font-size:${7 + Math.random() * 6}px;--sx:${(Math.random() - .5) * 30}px;--sy:${-(10 + Math.random() * 22)}px`;
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 860);
  }, { passive: true });
}

/* ---- magnetic controls ---- */
function setupMagnetic() {
  if (!window.matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const pick = () => Array.from(document.querySelectorAll('.hero-cta .btn, .to-top'));
  document.addEventListener('mousemove', e => {
    pick().forEach(el => {
      const r = el.getBoundingClientRect();
      const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
      const d = Math.hypot(dx, dy);
      if (d < 110 && !reduce) {
        const pull = Math.min(1, (110 - d) / 110) * 7;
        el.style.transform = `translate(${(dx / d) * pull}px, ${(dy / d) * pull}px)`;
      } else if (el.style.transform) el.style.transform = '';
    });
  }, { passive: true });
}

/* ---- hero rotor: rotating tagline ---- */
let _rotorStarted = false;
function setupRotor() {
  const el = document.querySelector('.rotor-txt');
  if (!el || _rotorStarted) return;
  _rotorStarted = true;
  const phrases = ['Licensed & device-secured keys', 'One-time purchase · lifetime updates', 'Protected by advanced device licensing', 'Trusted by premium creators'];
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let i = 0;
  setInterval(() => {
    i = (i + 1) % phrases.length;
    el.style.opacity = '0';
    el.style.transform = 'translateY(8px)';
    setTimeout(() => {
      el.textContent = phrases[i];
      el.style.opacity = '';
      el.style.transform = '';
    }, 300);
  }, 3600);
}

/* ---- marquee: duplicate content for a seamless loop ---- */
function setupMarquee() {
  const track = document.querySelector('.marquee-track');
  if (!track || track.dataset.dup) return;
  track.dataset.dup = '1';
  track.innerHTML += track.innerHTML;
}

/* ---- boot ---- */
async function init() {
  const started = performance.now();
  runLoaderProgress();
  if (localStorage.getItem('kp_theme') === 'light') document.documentElement.setAttribute('data-theme', 'light');
  setupWow();
  setupReveal();
  setupScrollFx();
  setupDust();
  setupSounds();
  setupClickBurst();
  setupSparkleTrail();
  setupMagnetic();
  try {
    await API.boot();
    renderShell();
    startStatusPinger();
    window.addEventListener('hashchange', router);
    await router();
  } catch (err) {
    console.error('Boot failed', err);
    document.getElementById('app').innerHTML = `<div class="page">${emptyHtml('Could not start', 'The storage or server this app relies on could not be reached.')}</div>`;
  } finally {
    setTimeout(finishLoader, Math.max(0, 1500 - (performance.now() - started)));
  }
}
init();
