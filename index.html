      if (!u) return fail('auth', 'You must be logged in to do that.');
      const r = byIdIn('reviews', reviewId);
      if (!r) return fail('notfound', 'Review not found.');
      if (r.userId !== u.id) return fail('forbidden', 'Only the author of this review can delete it.');
      store.del('reviews', reviewId);
      flush();
      return ok(true);
    }

    /* ============ REPORTS ============ */
    const REPORT_TYPES = ['asset', 'comment', 'user'];
    async function createReport(user, { targetType, targetId, reason, details } = {}) {
      const u = resolveUser(user);
      if (!u) return fail('auth', 'You must be logged in to do that.');
      if (isBanned(u)) return fail('banned', 'Your account is banned.');
      targetType = String(targetType || '').toLowerCase();
      if (!REPORT_TYPES.includes(targetType)) return fail('invalid', 'Invalid report target.');
      reason = String(reason || '').trim();
      details = String(details || '').trim().slice(0, 1000);
      if (reason.length < 3 || reason.length > 200) return fail('invalid', 'Choose or describe a reason for this report.');
      let self = false;
      if (targetType === 'asset') { const a = byIdIn('assets', targetId); if (!a) return fail('notfound', 'This asset does not exist.'); self = a.ownerId === u.id; }
      else if (targetType === 'comment') { const c = byIdIn('comments', targetId); if (!c) return fail('notfound', 'This comment does not exist.'); self = c.userId === u.id; }
      else { const t = dbUser(targetId); if (!t) return fail('notfound', 'This user does not exist.'); self = t.id === u.id; }
      if (self) return fail('self', 'You cannot report your own content.');
      if (all('reports').some(r => r.reporterId === u.id && r.targetType === targetType && r.targetId === targetId && r.status === 'open'))
        return fail('duplicate', 'You have already reported this. Our team will review it.');
      store.put('reports', { id: 'r' + uid(), reporterId: u.id, targetType, targetId, reason, details, status: 'open', resolvedBy: null, resolvedAt: null, createdAt: now() });
      flush();
      return ok(true);
    }
    function reportContext(rep) {
      const out = { id: rep.id, reporterId: rep.reporterId, targetType: rep.targetType, targetId: rep.targetId, reason: rep.reason, details: rep.details, status: rep.status, resolvedBy: rep.resolvedBy, resolvedAt: rep.resolvedAt, createdAt: rep.createdAt, reporter: publicUser(dbUser(rep.reporterId)) };
      if (rep.targetType === 'asset') out.asset = summarize(byIdIn('assets', rep.targetId));
      else if (rep.targetType === 'comment') {
        const c = byIdIn('comments', rep.targetId);
        const a = c ? byIdIn('assets', c.assetId) : null;
        out.comment = c ? { id: c.id, body: c.body, userId: c.userId, assetId: c.assetId, assetTitle: a ? a.title : null, user: publicUser(dbUser(c.userId)) } : null;
      } else out.user = publicUser(dbUser(rep.targetId));
      return out;
    }
    async function adminReports(actor) {
      const r = requireAdmin(actor); if (r) return r;
      const rows = all('reports').slice().sort((x, y) => y.createdAt - x.createdAt);
      return ok({ open: rows.filter(x => x.status === 'open').map(reportContext), resolved: rows.filter(x => x.status === 'resolved').map(reportContext) });
    }
    async function adminResolveReport(actor, id) {
      const r = requireAdmin(actor); if (r) return r;
      const rep = byIdIn('reports', id);
      if (!rep) return fail('notfound', 'Report not found.');
      rep.status = 'resolved';
      rep.resolvedBy = actor.id;
      rep.resolvedAt = now();
      store.put('reports', rep);
      flush();
      return ok(true);
    }

    /* ============ PUBLIC PROFILE & CONTENT ============ */
    async function publicProfile(handle) {
      const u = all('users').find(x => x.handle.toLowerCase() === String(handle || '').toLowerCase());
      if (!u) return fail('notfound', 'This user does not exist.');
      const assets = all('assets').filter(a => a.ownerId === u.id && a.status === 'approved').sort((x, y) => y.createdAt - x.createdAt).slice(0, 12).map(summarize);
      const purchases = all('purchases').filter(p => p.buyerId === u.id).sort((x, y) => y.createdAt - x.createdAt).slice(0, 8).map(p => ({ ...p, asset: summarize(byIdIn('assets', p.assetId)) }));
      const comments = all('comments').filter(c => c.userId === u.id).sort((x, y) => y.createdAt - x.createdAt).slice(0, 8).map(c => ({ ...c, asset: byIdIn('assets', c.assetId) ? summarize(byIdIn('assets', c.assetId)) : null }));
      return ok({ user: publicUser(u), assetCount: all('assets').filter(a => a.ownerId === u.id && a.status === 'approved').length, assets, purchases, comments });
    }
    async function content() {
      const parseLinks = it => { try { const l = JSON.parse(it.links || '[]'); return Array.isArray(l) ? l : []; } catch (e) { return []; } };
      const portfolio = all('portfolio').slice().sort((a, b) => ((b.featured ? 1 : 0) - (a.featured ? 1 : 0)) || ((b.createdAt || 0) - (a.createdAt || 0))).map(it => {
        let imgs = [];
        try { imgs = JSON.parse(it.images || '[]'); if (!Array.isArray(imgs)) imgs = []; } catch (e) { imgs = []; }
        return { ...it, images: imgs, links: parseLinks(it) };
      });
      /* Creators are listed in publish order — new ones append after existing. */
      const creators = all('creators').slice().sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)).map(it => ({ ...it, links: parseLinks(it) }));
      return ok({ portfolio, creators });
    }

    /* ============ PORTFOLIO (admin-published showcase) ============ */
    function cleanPortfolioLinks(links) {
      if (!Array.isArray(links)) return [];
      return links.map(l => ({ url: String((l && l.url) || '').trim() })).filter(l => /^https?:\/\//i.test(l.url)).slice(0, 12).map(l => ({ url: l.url.slice(0, 500) }));
    }
    async function createPortfolio(actor, { title, category, desc, stat, status, imageUrl, images, links, featured, creatorId } = {}) {
      const r = requireCofounder(actor, 'create portfolio posts'); if (r) return r;
      title = String(title || '').trim();
      desc = String(desc || '').trim();
      if (title.length < 3 || title.length > 80) return fail('invalid', 'Project title must be 3–80 characters.');
      if (desc.length < 10) return fail('invalid', 'A description is required (at least 10 characters).');
      const img = normalizeImageUrl(imageUrl);
      const imgs = (Array.isArray(images) ? images : [])
        .map(x => normalizeImageUrl(x)).filter(Boolean).slice(0, 12);
      const item = {
        id: 'pp' + uid(), title, category: String(category || '').trim().slice(0, 40),
        desc, stat: String(stat || '').trim().slice(0, 60), status: String(status || 'Live').trim().slice(0, 24),
        imageUrl: img, images: JSON.stringify(imgs), links: JSON.stringify(cleanPortfolioLinks(links)), featured: !!featured, creatorId: String(creatorId || '').trim() || null, createdAt: now(),
      };
      if (item.featured) all('portfolio').filter(x => x.featured && x.id !== item.id).forEach(x => { x.featured = false; store.put('portfolio', x); });
      store.put('portfolio', item);
      flush();
      return ok({ id: item.id });
    }
    async function updatePortfolio(actor, id, patch = {}) {
      const r = requireCofounder(actor, 'edit portfolio posts'); if (r) return r;
      const it = byIdIn('portfolio', id);
      if (!it) return fail('notfound', 'Project not found.');
      if (patch.title !== undefined) {
        const t = String(patch.title || '').trim();
        if (t.length < 3 || t.length > 80) return fail('invalid', 'Project title must be 3–80 characters.');
        it.title = t;
      }
      if (patch.desc !== undefined) {
        const d = String(patch.desc || '').trim();
        if (d.length < 10) return fail('invalid', 'A description is required (at least 10 characters).');
        it.desc = d;
      }
      if (patch.category !== undefined) it.category = String(patch.category || '').trim().slice(0, 40);
      if (patch.stat !== undefined) it.stat = String(patch.stat || '').trim().slice(0, 60);
      if (patch.status !== undefined) it.status = String(patch.status || 'Live').trim().slice(0, 24);
      if (patch.imageUrl !== undefined) {
        const img = normalizeImageUrl(patch.imageUrl);
        if (img === null && String(patch.imageUrl || '').trim()) return fail('invalid', 'Image link must be a valid http(s) URL.');
        it.imageUrl = img;
      }
      if (patch.images !== undefined) {
        const imgs = (Array.isArray(patch.images) ? patch.images : [])
          .map(x => normalizeImageUrl(x)).filter(x => !!x).slice(0, 12);
        it.images = JSON.stringify(imgs);
      }
      if (patch.links !== undefined) it.links = JSON.stringify(cleanPortfolioLinks(patch.links));
      if (patch.creatorId !== undefined) it.creatorId = String(patch.creatorId || '').trim() || null;
      if (patch.featured !== undefined) {
        it.featured = !!patch.featured;
        if (it.featured) all('portfolio').filter(x => x.featured && x.id !== it.id).forEach(x => { x.featured = false; store.put('portfolio', x); });
      }
      store.put('portfolio', it);
      flush();
      return ok(true);
    }

    /* Admin email blasts — drafts, immediate sends, and scheduled sends.
       The branded HTML shell is applied automatically by the mailer; admins
       only write the subject + main content. Users who unsubscribed are
       always skipped (see the unsubscribe route + Brevo webhook below). */
    function blastTargets(userIds) {
      let targets = all('users');
      if (Array.isArray(userIds) && userIds.length) {
        const set = new Set(userIds.map(String));
        targets = targets.filter(u => set.has(u.id));
      }
      return targets.filter(u => okEmail(u.email) && !u.unsubscribed);
    }
    function deliverBlast(blast) {
      let targets;
      try { targets = JSON.parse(blast.recipients || '[]'); } catch (e) { targets = []; }
      if (!Array.isArray(targets) || !targets.length) return 0;
      let sent = 0;
      for (const uid of targets) {
        const u = dbUser(uid);
        if (!u || !okEmail(u.email) || u.unsubscribed) continue;
        sendEmail({ to: u.email, subject: blast.subject, action: 'blast', body: 'Hi ' + (u.displayName || u.handle) + ',\n\n' + blast.body, link: '#/' });
        sent++;
      }
      return sent;
    }
    async function adminSendEmail(actor, { userIds, subject, body, scheduleAt, draft } = {}) {
      const r = requireAdmin(actor); if (r) return r;
      subject = String(subject || '').trim();
      body = String(body || '').trim();
      if (subject.length < 1 || subject.length > 120) return fail('invalid', 'Subject must be 1–120 characters.');
      if (body.length < 1 || body.length > 2000) return fail('invalid', 'Message must be 1–2000 characters.');
      const targets = blastTargets(userIds);
      if (!targets.length) return fail('invalid', 'No recipients matched a valid email address (unsubscribed users are skipped).');
      const recipientIds = targets.map(u => u.id);
      const when = scheduleAt ? Number(scheduleAt) : 0;
      if (when && when < now()) return fail('invalid', 'Schedule time must be in the future.');
      /* Saved as a draft (no send), scheduled (fires later), or sent now. */
      if (draft || when) {
        const blast = {
          id: 'mb' + uid(), subject, body,
          recipients: JSON.stringify(recipientIds),
          status: draft ? 'draft' : 'scheduled',
          scheduledFor: when || null, createdAt: now(), updatedAt: now(), sentAt: null,
        };
        store.put('mail_blasts', blast);
        flush();
        return ok({ saved: true, id: blast.id, status: blast.status, scheduledFor: when || null, recipients: recipientIds.length });
      }
      const sent = deliverBlast({ id: 'mb' + uid(), subject, body, recipients: JSON.stringify(recipientIds) });
      flush();
      return ok({ sent, total: recipientIds.length });
    }
    async function adminListBlasts(actor) {
      const r = requireAdmin(actor); if (r) return r;
      const rows = all('mail_blasts').slice().sort((a, b) => b.createdAt - a.createdAt);
      return ok(rows.map(b => {
        let recipients = [];
        try { recipients = JSON.parse(b.recipients || '[]'); } catch (e) {}
        return { ...b, recipientCount: recipients.length };
      }));
    }
    async function adminDeleteBlast(actor, id) {

    }
    /* Called by the server on an interval — fires any scheduled blasts whose
       time has come. No-op when nothing is due. */
    function processScheduledBlasts() {
      const due = all('mail_blasts').filter(b => b.status === 'scheduled' && b.scheduledFor && b.scheduledFor <= now());
      let fired = 0;
      for (const b of due) {
        const sent = deliverBlast(b);
        b.status = 'sent'; b.sentAt = now(); b.updatedAt = now();
        store.put('mail_blasts', b);
        fired += sent;
      }
      if (fired) { flush(); console.log('[blast] fired scheduled email → ' + fired + ' recipients'); }
      return fired;
    }

          { name: 'License gate', detail: 'Roblox checks in with system name + password; wrong pair = no activation, logged.' },

          { name: 'Founder identity bypass', detail: 'Your account keeps Founder powers even if its role row is edited.' },
        ],
      };
      security.authFails24h = recent(24 * 3600e3).filter(e => e.type === 'auth_fail').length; // fix the accidental override above
      return ok({ server: { uptimeSeconds: Math.round(upt), memory: { rssMB: +(mem.rss / 1048576).toFixed(1), heapMB: +(mem.heapUsed / 1048576).toFixed(1) }, loadAvg, node: process.version, platform: process.platform, time: now() }, db: { bytes: dbBytes, uploadsBytes, counts, integrity: dbStats && dbStats.integrity || null }, security, paymentConfigured: (() => { try { const row = byIdIn('site_settings', 'payment_config'); if (!row) return false; const v = JSON.parse(row.value); return !!(v.gcashQrUrl || v.kofiUrl || v.paypalAccount); } catch (e) { return false; } })(), imageHost: (await getImgurSettings()).data });

    /* ============ SYSTEM REGISTERING (creator → Roblox Studio licensing) ============ */
    /* Matches the copyable Lua script's API contract:
       POST /api/systems/{activate,heartbeat,device}
       Body: { systemName, systemPassword, deviceId | playerId, playerName }
       Reply: { ok, data: { active, reason } } */
    const SYS_STATES = ['active', 'disabled'];
    /* Subscription 1/2/3 → max registered systems + registrations per day (0 = unlimited).
       Deleting a system is always instant — only registering is limited.
       VIP (complimentary tier) plays at Subscription-1 limits: 3 systems, 1/day.
       The Founder can raise an individual VIP above that via Plans on the panel. */
    const PROT_LIMITS = [{ max: 3, perDay: 1 }, { max: 10, perDay: 0 }, { max: 50, perDay: 0 }];
    const VIP_LIMITS = { max: 3, perDay: 1 };
    function systemPlanLimits(u) {
      const pT = Math.min(3, Math.max(0, Number(u.protectionTier) || 0));
      const cT = Math.min(3, Math.max(0, Number(u.contractTier) || 0));
      if (pT >= 1 && cT >= 1) return { max: Math.max(PROT_LIMITS[pT - 1].max, PROT_LIMITS[cT - 1].max), perDay: Math.min(PROT_LIMITS[pT - 1].perDay, PROT_LIMITS[cT - 1].perDay) || 0, label: pT >= cT ? 'Subscription ' + pT : 'Contract ' + cT };
      if (pT >= 1) return { ...PROT_LIMITS[pT - 1], label: 'Subscription ' + pT };
      if (cT >= 1) return { ...PROT_LIMITS[cT - 1], label: 'Contract ' + cT };
      if (isVipUser(u)) return { ...VIP_LIMITS, label: 'VIP' };
      return null;
    }
    function findSystemByCreds(name, password) {
      return all('systems').find(s => String(s.name || '').trim().toLowerCase() === String(name || '').trim().toLowerCase() && s.password === String(password || ''));
    }
    function systemPublic(s) {
      return { id: s.id, name: s.name, status: s.status, createdAt: s.createdAt, lastSeenAt: s.lastSeenAt, staffNote: s.staffNote || null };
    }
    function systemForOwner(s) {

        .map(d => ({ id: d.id, deviceId: d.deviceId, deviceName: d.deviceName, status: d.status, lastSeenAt: d.lastSeenAt }));

      return { ...systemPublic(s), password: s.password, kickOnDeny: s.kickOnDeny !== 0, banOnBlacklist: s.banOnBlacklist === 1, devices, games };
    }
    async function registerSystem(user, { name, password } = {}) {
      const u = resolveUser(user);
      if (!u) return fail('auth', 'You must be logged in to do that.');
      if (effRank(u) < roleRank('vip') && !isTester(u)) return fail('vipOnly', 'System registering is a Licensed feature — grab a Subscription or Contract to unlock it.');
      /* Founder / Co-Founder run the platform, so they register freely —
         the plan gate applies to Admins and below. */
      if (isStaff(u) && effRank(u) < roleRank('cofounder') && !(Number(u.protectionTier) > 0) && !(Number(u.contractTier) > 0) && !isTester(u)) return fail('vipOnly', 'Admins register systems only with a plan — grant one on the Founder Panel, or buy on the Subscription page.');
      name = String(name || '').trim();
      password = String(password || '').trim();
      if (name.length < 3 || name.length > 60) return fail('invalid', 'System name must be 3–60 characters.');
      if (password.length < 6 || password.length > 80) return fail('invalid', 'System password must be 6–80 characters.');
      if (!/^[\w .\-()&'"!?+]+$/.test(name)) return fail('invalid', 'System name may only contain letters, numbers, spaces, and basic punctuation.');
      /* Duplicate names are allowed on purpose — the name + password PAIR is
         the identity (e.g. "Music System" + "PassWorD"). */
      const mine = () => all('systems').filter(s => s.userId === u.id);
      /* Founder / Co-Founder: no limits at all. Admins and sellers follow
         their plan; VIPs get the complimentary Subscription-1 caps. */
      if (effRank(u) < roleRank('cofounder') && !isTester(u)) {
        const plan = systemPlanLimits(u);
        if (!plan) return fail('vipOnly', 'Buy a Subscription plan (Subscription page) to register systems.');
        const list = mine();
        if (list.length >= plan.max) return fail('limit', 'Your ' + plan.label + ' plan allows up to ' + plan.max + ' registered systems. Deleting one is instant and frees a slot.');
        if (plan.perDay > 0) {
          const dayStart = new Date(); dayStart.setHours(0, 0, 0, 0);
          if (list.filter(s => s.createdAt >= dayStart.getTime()).length >= plan.perDay)
            return fail('cooldown', 'Your ' + plan.label + ' plan allows ' + plan.perDay + ' system registration per day — upgrade your Subscription for more.');
        }
      }
      const t = now();
      const s = { id: 'sys' + uid(), userId: u.id, name, password, status: 'active', createdAt: t, updatedAt: t, lastSeenAt: null };
      store.put('systems', s);
      flush();
      return ok(systemForOwner(s));
    }

    /* Re-resolve every game row's real name + creator from Roblox's public API.
       Heals rows recorded before the Lua sent rich metadata ("Game", "Group 123"). */
    async function refreshSystemGames(actor, systemId) {
      const u = resolveUser(actor);
      if (!u) return fail('auth', 'You must be logged in to do that.');
      const s = byIdIn('systems', systemId);
      if (!s) return fail('notfound', 'System not found.');
      const owner = byIdIn('users', s.userId);
      const rank = u ? effRank(u) : 0;
      if (s.userId !== u.id && rank < roleRank('admin')) return fail('forbidden', 'This is not your system.');
      if (typeof fetch !== 'function') return fail('invalid', 'Game info refresh is only available on the server.');
      const games = all('system_games').filter(g => g.systemId === s.id);
      let healed = 0;
      await Promise.all(games.map(async g => {
        try {
          const ctl = new AbortController();
          const timer = setTimeout(() => ctl.abort(), 6000);
          const ur = await fetch('https://apis.roblox.com/universes/v1/places/' + g.placeId + '/universe', { signal: ctl.signal });
          const uj = await ur.json();
          if (!uj || !uj.universeId) return;
          const gr = await fetch('https://games.roblox.com/v1/games?universeIds=' + uj.universeId, { signal: ctl.signal });
          const gj = await gr.json();
          clearTimeout(timer);
          const info = gj && gj.data && gj.data[0];
          if (!info) return;
          let changed = false;
          if (info.name && info.name !== 'Game' && g.gameName !== info.name) { g.gameName = String(info.name).slice(0, 80); changed = true; }
          if (info.creator && info.creator.name && g.gameOwner !== info.creator.name) {
            g.gameOwner = String(info.creator.name).slice(0, 80);
            g.gameOwnerType = String(info.creator.type === 1 ? 'User' : info.creator.type === 2 ? 'Group' : (info.creator.type || '')).replace('Enum.CreatorType.', '');
            changed = true;
          }
          if (changed) { store.put('system_games', g); healed++; }
        } catch (e) { /* network/parse failure — keep the old labels */ }
      }));
      if (healed) flush();
      return ok({ healed, system: systemForOwner(s) });
    }
    /* The heart of the anti-leak flow: the game checks in with the name +
       password; a match means the system is licensed. First successful contact
       flips PENDING → ACTIVE; a paused (disabled) system is always denied. */
    function checkSystemCreds(body) {
      const s = findSystemByCreds(body && body.systemName, body && body.systemPassword);
      if (!s) {
        recordSecurityEvent('license_check_failed', { systemName: String((body && body.systemName) || '').slice(0, 40), placeId: String((body && body.placeId) || '').slice(0, 25) || null });
        return { found: false, reason: 'No system matches that name and password. Double-check them on the Dashboard.' };
      }
      if (s.status === 'disabled') return { found: true, denied: true, reason: 'This system has been paused by its creator. Contact the creator to re-enable it.' };
      return { found: true, system: s };
    }
    /* Shared device bookkeeping + a revoked-device auto-kick: a device the
       creator kicked gets a DENIED answer on its next check-in, so the Lua
       script disables the system (and kicks the player) immediately. */
    /* Security logging: wrong system name+password = someone probing the license gate. */
    function deviceState(s, deviceId) {
      if (!deviceId) return null;
      const d = all('system_devices').find(x => x.systemId === s.id && x.deviceId === String(deviceId));
      return d || null;
    }
    function recordDevice(s, deviceId, deviceName) {
      const key = String(deviceId).slice(0, 80);
      const existing = all('system_devices').find(d => d.systemId === s.id && d.deviceId === key);
      if (existing) { existing.lastSeenAt = now(); if (deviceName) existing.deviceName = String(deviceName).slice(0, 40) || null; store.put('system_devices', existing); return existing; }
      const d = { id: 'sd' + uid(), systemId: s.id, deviceId: key, deviceName: deviceName ? String(deviceName).slice(0, 40) : null, status: 'active', createdAt: now(), lastSeenAt: now() };
      store.put('system_devices', d);
      return d;
    }
    /* A "game" is a Roblox place (placeId) using the system. Games register
       themselves when a server checks in; the creator can revoke or
       blacklist a game, and silent ones (30 days) fall off the list. */
    const GAME_STALE_MS = 30 * 24 * 3600 * 1000;
    function gameRow(s, placeId) {
      if (!placeId) return null;
      const key = String(placeId).slice(0, 20);
      return all('system_games').find(g => g.systemId === s.id && g.placeId === key) || null;
    }
    function recordGame(s, placeId, meta) {
      const key = String(placeId || '').slice(0, 20);
      if (!/^\d{1,20}$/.test(key)) return null;
      const existing = gameRow(s, key);
      if (existing) {
        existing.lastSeenAt = now();
        if (meta) {
          /* The Lua sends the live game's real name + creator on every
             check-in — always refresh so old rows self-heal (e.g. rows that
             stored the raw "Enum.CreatorType.Group 123" label). */
          if (meta.gameName) existing.gameName = String(meta.gameName).slice(0, 80);
          if (meta.gameOwner != null && meta.gameOwner !== '') existing.gameOwner = String(meta.gameOwner).slice(0, 80);
          if (meta.gameOwnerType && !existing.gameOwnerType) existing.gameOwnerType = String(meta.gameOwnerType).slice(0, 20);
        }
        store.put('system_games', existing);
        return existing;
      }

/* Upload a local image to Imgur through the server proxy; returns the hosted URL. */
async function uploadImageFile(file, onProgress) {
  if (!file) return { ok: false, error: 'Choose an image file first.' };
  if (!/^image\/(png|jpe?g|gif|webp)$/.test(file.type)) return { ok: false, error: 'Only png, jpg, gif and webp images are supported.' };
  if (file.size > 10 * 1024 * 1024) return { ok: false, error: 'Image is too large (max 10 MB).' };
  const fd = new FormData();
  fd.append('image', file, file.name);
  try {
    const r = await fetch('/api/upload-image', { method: 'POST', body: fd, headers: { Authorization: 'Bearer ' + _getToken() } });
    const j = await r.json();
    if (!j.ok) return { ok: false, error: j.error || 'Upload failed.' };
    return { ok: true, url: j.data.url, deletehash: j.data.deletehash };
  } catch (e) { return { ok: false, error: 'Upload failed — check your connection and try again.' }; }
}
/* One reusable widget: an Upload button + progress hint wired to a text input.
   mode: 'replace' fills the input with the URL; 'appendRow' adds an extra-photo row. */
function imageUploadButton(inputEl, opts = {}) {
  const wrap = document.createElement('span');
  wrap.style.cssText = 'display:inline-flex;align-items:center;gap:8px';
  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'btn btn-ghost btn-sm';
  btn.innerHTML = (ICON.up || ICON.plus) + ' Upload';
  const status = document.createElement('span');
  status.className = 'muted small'; status.style.cssText = 'max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
  const fileInput = document.createElement('input');
  fileInput.type = 'file'; fileInput.accept = 'image/png,image/jpeg,image/gif,image/webp'; fileInput.style.display = 'none';
  btn.onclick = () => fileInput.click();
  fileInput.onchange = async () => {
    const f = fileInput.files && fileInput.files[0];
    if (!f) return;
    status.textContent = 'Uploading ' + f.name + '…';
    btn.disabled = true;
    const r = await uploadImageFile(f);
    btn.disabled = false;
    if (!r.ok) { status.textContent = r.error; toast(r.error, 'err'); return; }
    status.textContent = 'Uploaded ✓ ' + r.url;
    if (!opts.appendRow && inputEl) {
      inputEl.value = r.url;
      /* Fire 'input' so live previews and listeners react to the filled URL. */
      inputEl.dispatchEvent(new Event('input', { bubbles: true }));
    }
    if (opts.onDone) opts.onDone(r.url);
    toast('Image uploaded — URL filled in.');
  };
  wrap.appendChild(btn); wrap.appendChild(status); wrap.appendChild(fileInput);
  return wrap;
}

/* Creator avatar: image URL if valid, else initials — never collapses when
   the image fails to load (falls back to initials instead). */
/* Route known image hosts through the server's /api/img proxy — it turns
   imgur "page" links (imgur.com/abc) into the direct image and adds browser
   headers so hotlink-blocked CDNs serve the picture. Falls back to the raw
   URL for anything else. */
function proxiedImageUrl(u) {
  const s = String(u || '');
  if (!s) return '';
  if (/^https?:\/\/(i\.imgur\.com|imgur\.com|media\.discordapp\.net|cdn\.discordapp\.com|i\.redd\.it|preview\.redd\.it|pbs\.twimg\.com|i\.ibb\.co|files\.catbox\.moe|litter\.catbox\.moe|gcdnb\.pbrd\.co|i\.imgsli\.com|i\.postimg\.cc|i\.pixhost\.to)\//i.test(s)) return '/api/img?u=' + encodeURIComponent(s);
  return s;
}
function creatorAvatarHtml(cr, px = 78) {
  const url = proxiedImageUrl(cr && cr.imageUrl);
  /* Both branches keep the round .avatar shell so the circle never turns
     into a square, and a bad URL swaps to initials instead of collapsing. */
  const img = url ? `<span class="avatar" style="width:${px}px;height:${px}px"><img src="${esc(url)}" alt="" loading="lazy" onerror="this.closest('[data-cr-avatar]').innerHTML = this.closest('[data-cr-avatar]').dataset.fallback"></span>` : '';
  const fallback = avatarHtml({ displayName: cr && cr.name }, px);
  return `<span data-cr-avatar data-fallback="${esc(fallback)}" style="display:block">${img || fallback}</span>`;
}
function badgeHtml(role, tags, tiers) {
  const pt = tiers ? Math.max(0, Number(tiers.protectionTier) || 0) : 0;
  const ct = tiers ? Math.max(0, Number(tiers.contractTier) || 0) : 0;

  else if (role === 'cofounder') main = `<span class="badge cofounder" title="Co-Founder — can do everything">Co-Founder</span>`;

  else if (role === 'vip') main = `<span class="badge vip" title="VIP — complimentary access to the studio's own systems">VIP</span>`;
  else if (role === 'licensed') {

  return main + extra;

/* ---- toast ---- */
function toast(msg, type = 'ok') {
  SFX.play(type === 'err' ? 'error' : 'success');
  let box = document.getElementById('toasts');
  if (!box) { box = document.createElement('div'); box.id = 'toasts'; document.body.appendChild(box); }
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<span>${type === 'err' ? '✕' : type === 'ok' ? '✓' : 'i'}</span><span>${esc(msg)}</span>`;
  box.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 350); }, 3400);
}

/* ---- modal ---- */
function modal({ title, body, confirmLabel = 'Confirm', cancelLabel = 'Cancel', danger = false, onConfirm, validate, confirmOnly = false, wide = false, afterOpen }) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal ${wide ? 'modal-wide' : ''}" role="dialog" aria-modal="true">
    <h3>${esc(title)}</h3>
    <div class="modal-body">${body}</div>
    <div class="modal-actions">${confirmOnly ? '' : `<button class="btn btn-ghost btn-sm" data-act="cancel">${esc(cancelLabel)}</button>`}
    <button class="btn ${danger ? 'btn-solid-danger' : 'btn-primary'} btn-sm" data-act="confirm">${esc(confirmLabel)}</button></div></div>`;
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  const cancelBtn = overlay.querySelector('[data-act=cancel]');
  if (cancelBtn) cancelBtn.onclick = close;
  overlay.querySelector('[data-act=confirm]').onclick = async () => {
    const btn = overlay.querySelector('[data-act=confirm]');
    btn.disabled = true;
    const val = validate ? await validate(overlay) : {};
    if (val === false) { btn.disabled = false; return; }
    close();
    onConfirm && onConfirm(val);
  };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey, true);
  function close() { document.removeEventListener('keydown', onKey, true); overlay.remove(); }
  document.body.appendChild(overlay);
  setTimeout(() => { const f = overlay.querySelector('input,textarea,select'); f && f.focus(); if (afterOpen) afterOpen(overlay); }, 30);
  return overlay;
}
function promptModal({ title, label, placeholder, confirmLabel = 'Confirm', danger = false, onConfirm, type = 'text', required, body = '', extraFields = [] }) {
  modal({
    title, confirmLabel, danger, onConfirm,
    body: `${body}<div class="field"><label>${esc(label)}</label><input class="input" id="pm-input" type="${type}" placeholder="${esc(placeholder || '')}"></div>${extraFields.map(f => `<div class="field"><label>${esc(f.label)}</label><input class="input" id="${esc(f.id)}" type="${esc(f.type || 'text')}" placeholder="${esc(f.placeholder || '')}"></div>`).join('')}`,
    validate: ov => { const v = ov.querySelector('#pm-input').value.trim(); if (required && !v) { toast('This field is required.', 'err'); return false; } const extra = {}; (extraFields || []).forEach(f => { const el = ov.querySelector('#' + f.id); extra[f.id] = el ? el.value.trim() : ''; }); return { value: v, extra }; },
  });
}

/* go() tolerates callers that already include the leading '#' (some card
   templates pass '#/asset/…'), otherwise the hash becomes '##/…' and the
   router treats the path as '#' and bounces the user home. */
const go = path => { location.hash = '#' + String(path || '').replace(/^#+/, ''); };
function parseHash() {
  const h = location.hash.replace(/^#+\/?/, '');
  const [pathPart, queryPart] = h.split('?');
  const segs = pathPart.split('/').filter(Boolean);
  return { path: segs[0] || 'home', params: segs.slice(1), query: Object.fromEntries(new URLSearchParams(queryPart || '')) };
}

let _badgeToken = 0;
async function paintNavBadges() {
  const token = ++_badgeToken;
  const u = STATE.user;
  const needsDash = u && canPost(u);
  const needsOrders = u && (!isStaff(u) || u.role === 'vip');
  if (!needsDash && !needsOrders) return;

    needsDash ? API.dashboardOrders(u).catch(() => null) : null,
    needsOrders ? API.myOrders(u).catch(() => null) : null,
  ]);
  if (token !== _badgeToken) return;   /* a newer render superseded this one */
  let dashCount = 0, ordCount = 0;
  if (dash && dash.ok && Array.isArray(dash.data)) dashCount = dash.data.filter(o => o.status !== 'completed').length;
  if (ord && ord.ok && Array.isArray(ord.data)) ordCount = ord.data.filter(o => (o.manual && (o.status === 'awaiting_proof' || o.status === 'pending_verification')) || (o.status === 'completed' && o.asset && !o.delivered)).length;
  const mark = () => `<span class="nav-alert" title="Action needed">!</span>`;
  document.querySelectorAll('[data-nav="dashboard"]').forEach(a => { const has = a.querySelector('.nav-alert'); if (dashCount > 0 && !has) a.insertAdjacentHTML('beforeend', mark()); else if (!dashCount && has) has.remove(); });

     act (dashboard / orders) get one. */
}

    const closeDrawer = () => { drawer.classList.remove('open'); backdrop.hidden = true; document.body.classList.remove('drawer-open'); hb.setAttribute('aria-expanded', 'false'); drawer.setAttribute('aria-hidden', 'true'); };
    hb.addEventListener('click', e => { e.stopPropagation(); drawer.classList.contains('open') ? closeDrawer() : openDrawer(); });
    backdrop.addEventListener('click', closeDrawer);
    closeBtn && closeBtn.addEventListener('click', closeDrawer);
    drawer.addEventListener('click', e => { if (e.target.closest('a,button')) closeDrawer(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && drawer.classList.contains('open')) closeDrawer(); });

const TITLES = {
  home: 'Kings Production — Premium Roblox Development Studio', shop: 'Shop — Kings Production',
  portfolio: 'Portfolio — Kings Production', subscription: 'Subscription — Kings Production', creators: 'Creators — Kings Production', creator: 'Creator — Kings Production',
  support: 'Support — Kings Production', ticket: 'Ticket — Kings Production',
  verify: 'Verify your email — Kings Production', faq: 'FAQ & Q&A — Kings Production',
  login: 'Log in — Kings Production', register: 'Create account — Kings Production',
  settings: 'Settings — Kings Production', admin: 'Panel — Kings Production', dashboard: 'Licensed Dashboard — Kings Production',
  privacy: 'Privacy Policy — Kings Production', terms: 'Terms of Use — Kings Production',
};
let _firstRoute = true;
async function router(opts = {}) {
  const { path, params, query } = parseHash();
  /* Auth pages are full-screen and focused — hide the site chrome around them. */
  document.body.classList.toggle('auth-mode', ['login', 'register', 'forgot', 'reset'].includes(path));
  if (!['home', 'shop', 'portfolio', 'subscription', 'creators', 'creator', 'support', 'ticket', 'verify', 'asset', 'profile', 'login', 'register', 'forgot', 'reset', 'settings', 'upload', 'my-assets', 'orders', 'dashboard', 'admin', 'privacy', 'terms', 'faq'].includes(path)) { location.hash = '#/'; return; }
  const me = await API.me();
  STATE.user = me.ok ? me.data : null;
  renderHeader();
  const main = document.getElementById('main');
  /* Cinematic gold veil sweep between pages — skipped on boot, admin tab flips,
     reduced-motion, or when the user disabled transitions in Settings. */
  const cinematic = !_firstRoute && !opts.noVeil && !window.matchMedia('(prefers-reduced-motion: reduce)').matches && localStorage.getItem('kp_transitions') !== '0';
  _firstRoute = false;
  if (cinematic) await transitionSwap(main);
  let html = loadingHtml();
  main.innerHTML = `<div class="view">${html}</div>`;
  try { html = await VIEWS[path]({ params, query }); }
  catch (e) { console.error(e); html = `<div class="page">${emptyHtml('Something went wrong', e.message || 'Unknown error')}</div>`; }
  main.innerHTML = `<div class="view">${html}</div>`;
  document.title = TITLES[path] || 'Kings Production';
  window.scrollTo({ top: 0 });
  const act = document.querySelector(`[data-nav="${path}"]`);
  if (act) { document.querySelectorAll('[data-nav]').forEach(a => a.classList.remove('active')); act.classList.add('active'); }
  if (VIEWS_BIND[path]) await VIEWS_BIND[path]({ params, query });
  bindReveals();
}
function transitionSwap(main) {
  return new Promise(res => {
    const old = main.querySelector('.view');
    if (old) old.classList.add('leaving');
    SFX.play('page');
    const veil = document.createElement('div');
    veil.className = 'view-veil';
    document.body.appendChild(veil);
    requestAnimationFrame(() => veil.classList.add('go'));
    setTimeout(res, 260);   // swap content mid-sweep
    setTimeout(() => veil.remove(), 800);
  });
}

function onVipTry(id) {
  if (!STATE.user) { go('/login'); return; }
  /* Straight to the required game details — no checkout/payment step at all. */
  modal({
    title: 'VIP Try — claim this system free',
    confirmLabel: 'Submit request',
    body: `<p class="muted small" style="margin:0 0 12px"><b style="color:var(--vip)">VIP perk:</b> no payment needed. Fill in your game details — Kings Production reviews every request and activates the license for your game once approved.</p>
      <div class="field"><label>Game name<span class="req">*</span></label><input class="input" id="vt-name" maxlength="80" placeholder="e.g. Blox Kingdom" required></div>
      <div class="field"><label>Game place ID<span class="req">*</span></label><input class="input" id="vt-place" maxlength="30" placeholder="e.g. 1234567890" required></div>
      <div class="field"><label>Game creator<span class="req">*</span></label><input class="input" id="vt-owner" maxlength="80" placeholder="Your username or group name" required></div>
      <div class="field"><label>Notes <span class="muted small" style="font-weight:400">(optional)</span></label><textarea class="textarea" id="vt-notes" rows="2" maxlength="300" placeholder="Anything the studio should know"></textarea></div>`,

async function openCheckout(assetId, plan) {
  const isAsset = !!assetId && !plan;
  STATE._checkoutSellerDetails = null;
  const isVip = plan === 'vip';
  const isVipTry = plan === 'vip_try';
  const isSub = plan && plan.startsWith('sub:');
  /* For a post, honor the seller's accepted payment methods (empty = all). */
  const PM_LABELS = { gcash_manual: 'GCash · manual (QR)', kofi_manual: 'Ko-fi · manual', paypal_manual: 'PayPal · manual', paypal: 'PayPal', stripe: 'Stripe', stripe_manual: 'Stripe · manual' };
  let sellerMethods = null;
  if (isAsset) {
    const ar = await API.getAsset(assetId, STATE.user && STATE.user.id);
    if (ar.ok && ar.data && !(Number(ar.data.price) > 0)) { onClaimFree(assetId); return; } // free post — no checkout
    if (ar.ok && ar.data && Array.isArray(ar.data.paymentMethods) && ar.data.paymentMethods.length) {
      const map = { gcash: 'gcash_manual', kofi: 'kofi_manual', paypal: 'paypal', stripe: 'stripe' };
      sellerMethods = ar.data.paymentMethods.map(m => map[m] || m);
      STATE._checkoutSellerDetails = ar.data.sellerPaymentDetails || null;
    } else {
      STATE._checkoutSellerDetails = null;
      if (ar.ok && ar.data && isAsset) { toast('This post has no accepted payment methods set — the seller must edit it. Purchase unavailable.', 'err'); return; }
    }
  }
  if (isVipTry) {
    const ar = await API.getAsset(assetId, STATE.user && STATE.user.id);
    if (ar.ok && ar.data) { STATE._checkoutSellerDetails = ar.data.sellerPaymentDetails || null; }
  }
  const subCategory = isSub ? plan.split(':')[1] : null;
  const subTier = isSub ? Number(plan.split(':')[2]) : null;
  const pm = await API.paymentMethods();
  let data = pm.ok && pm.data ? pm.data : { dev: true, methods: [] };
  let methods = data.methods || [];
  if (sellerMethods) {
    methods = methods.filter(m => sellerMethods.includes(m.id));
    if (!methods.length) methods = sellerMethods.filter(k => PM_LABELS[k]).map(k => ({ id: k, label: PM_LABELS[k], enabled: true, manual: true }));
  }
  const pmIcon = id => id.startsWith('stripe') ? 'S' : id.startsWith('paypal') ? 'P' : id.startsWith('gcash') ? 'G' : 'K';
  const cards = methods.map(m => `<button class="pm-card" type="button" data-method="${m.id}">
      <span class="pm-icon">${pmIcon(m.id)}</span>
      <span><b>${esc(m.label)}</b><small>${m.manual ? 'Pay manually · submit proof · staff verifies' : m.enabled ? 'Online payment · card / wallet' : 'Not configured yet'}</small></span>
    </button>`).join('');
  let body = '';
  let title = 'Checkout';
  if (isVipTry) {
    title = 'VIP Try — free checkout';
    body = `<p class="muted small" style="margin:0 0 14px"><b style="color:var(--vip)">VIP perk:</b> no payment needed for the studio's own systems. Fill in your game details, submit, and wait for Kings Production to approve and activate your license — same flow as a paid purchase.</p>`;
  } else if (isVip) {
    title = 'Get Licensed';
    body = `<p class="muted small" style="margin:0 0 14px">One-time payment of <b style="color:var(--vip)">${fmtPhp(500)}</b> — your account becomes <b style="color:var(--vip)">Licensed</b> forever, unlocking the ability to post your own assets.</p>`;
  } else if (isSub) {
    const subName = subCategory === 'protection' ? 'Subscription' : 'Contract';
    const subLabel = subCategory === 'protection'
      ? ['', 'Subscription 1', 'Subscription 2', 'Subscription 3'][subTier]
      : ['', 'Contract 1', 'Contract 2', 'Contract 3'][subTier];
    const phpPrice = subCategory === 'protection'
      ? [0, 300, 500, 1000][subTier]
      : [0, 500, 700, 1200][subTier];
    title = subLabel + ' — ' + subName;
    body = `<p class="muted small" style="margin:0 0 14px">One-time payment of <b style="color:var(--vip)">${fmtPhp(phpPrice)}</b> for <b>${subLabel}</b>. Your account will be upgraded instantly.</p>`;
  } else {
    title = 'Checkout';
    body = `<p class="muted small" style="margin:0 0 14px">Choose how to pay. Every purchase issues a <b>license key</b> you can assign to your Roblox game from the Subscription page. Your role only changes when you buy a plan.</p>
      <div style="border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px;background:var(--surface-2)">
        <b style="font-family:var(--font-display);font-size:14px">Your game details</b>
        <p class="muted small" style="margin:2px 0 10px">The seller reviews these to activate your license — make sure they match the game that will use the system.</p>
        <div class="row" style="gap:10px;flex-wrap:wrap">
          <div class="field" style="flex:1;min-width:150px;margin:0"><label>Game name</label><input class="input" id="gd-name" maxlength="80" placeholder="e.g. Music Game" style="background:var(--surface)"></div>
          <div class="field" style="flex:1;min-width:130px;margin:0"><label>Place / game ID</label><input class="input" id="gd-place" maxlength="20" inputmode="numeric" placeholder="e.g. 1234567890" style="background:var(--surface)"></div>
          <div class="field" style="flex:1;min-width:130px;margin:0"><label>Game owner</label><input class="input" id="gd-owner" maxlength="80" placeholder="user or group name" style="background:var(--surface)"></div>
        </div>
        <div class="field" style="margin:10px 0 0"><label>Notes for the seller <span class="muted small" style="font-weight:400">(optional)</span></label><input class="input" id="gd-notes" maxlength="400" placeholder="anything the seller should know" style="background:var(--surface)"></div>
      </div>`;
  }
  const ov = modal({
    title,
    cancelLabel: 'Cancel',
    body: `${body}
      <div class="pm-list">${cards}</div>
      ${data.dev ? `<p class="hint" style="margin-top:12px">Test mode — no payment gateway is connected yet, so checkout completes instantly (no money moves).</p>` : ''}`,
    confirmLabel: 'Continue',
    onConfirm: () => {},
  });
  ov.querySelector('[data-act=confirm]').classList.add('hidden');
  ov.querySelectorAll('.pm-card').forEach(c => c.addEventListener('click', async () => {
    const entry = methods.find(m => m.id === c.dataset.method);
    if (!entry || !entry.enabled) { toast('This payment method is not configured yet.', 'err'); return; }
    const gameDetails = (isAsset || isVipTry) ? { gameName: document.getElementById('gd-name') && document.getElementById('gd-name').value, placeId: document.getElementById('gd-place') && document.getElementById('gd-place').value, gameOwner: document.getElementById('gd-owner') && document.getElementById('gd-owner').value, notes: document.getElementById('gd-notes') && document.getElementById('gd-notes').value } : null;
    const res = await API.checkout(STATE.user, assetId, entry.id, plan, gameDetails);
    if (!res.ok) { toast(res.error, 'err'); if (res.code === 'timeout' || res.code === 'owned' || res.code === 'banned' || res.code === 'pending') await router(); return; }
    ov.remove();
    if (res.data && res.data.redirect) { location.href = res.data.redirect; return; }
    if (res.data && res.data.orderId && entry.manual) { await openManualPayment(res.data.orderId, entry.id, STATE._checkoutSellerDetails || null, assetId); return; }
    if (res.data && (res.data.licenseKey || res.data.vipUpgrade)) {
      /* Buying does NOT change your role — Licensed is for plan holders only. */
      toast(res.data.vipUpgrade ? 'Plan activated! It is on your Subscription page. 👑' : 'Purchase complete — your license key is ready.');
      burstAt(innerWidth / 2, innerHeight / 2, 30);
      SFX.play('purchase');
      await router();
      return;
    }
    toast('Purchase complete.'); await router();
  }));
}

    afterOpen: ovm => { attachImageUploadWidgets(ovm); },

/* Offered when the primary file host fails — the seller's mirror link. */
function showBackupLink(url) {
  const lb = document.createElement('div');
  lb.className = 'backup-modal';
  lb.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9600;display:flex;align-items:center;justify-content:center;padding:24px';
  lb.innerHTML = `<div style="background:var(--surface);border:1px solid var(--gold);border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.6)">
    <h3 style="font-family:var(--font-display);margin:0 0 8px">Primary host unreachable</h3>
    <p class="muted small" style="margin:0 0 14px">The seller provided a backup link for this file. Open it to grab your download — then let the seller know in the chat if it worked.</p>
    <div class="row" style="gap:10px;flex-wrap:wrap"><a class="btn btn-primary" href="${esc(url)}" target="_blank" rel="noopener noreferrer" onclick="this.closest('.backup-modal').remove()">Open backup link</a><button class="btn btn-ghost" type="button" onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(url)}').then(()=>toast('Backup link copied.'))">Copy link</button><button class="btn btn-ghost" type="button" onclick="this.closest('.backup-modal').remove()">Close</button></div>
  </div>`;
  lb.addEventListener('click', e => { if (e.target === lb) lb.remove(); });
  document.body.appendChild(lb);
}
async function triggerFileDownload(res) {
  if (!res.ok) { toast(res.error, 'err'); return; }
  if (res.data.url) {
    try {
      /* The gated file route authenticates via Bearer token (localStorage). */
      const r = await fetch(res.data.url, { headers: { Authorization: 'Bearer ' + _getToken() } });
      if (!r.ok) {
        let msg = 'download failed ' + r.status, backup = null;
        try { const j = await r.json(); if (j && j.error) msg = j.error; if (j && j.backupUrl) backup = j.backupUrl; } catch (e) {}
        if (backup) { showBackupLink(backup); return; }
        throw new Error(msg);
      }
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = res.data.fileName || 'asset-file';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    } catch (err) {
      if (res.data.backupUrl) { showBackupLink(res.data.backupUrl); return; }
      toast(err && err.message && !/failed/.test(err.message) ? err.message : 'Could not download the file — try again, or ask the seller to re-upload.', 'err'); return;
    }
  } else {
    const a = document.createElement('a');
    a.href = res.data.dataURL; a.download = res.data.fileName || 'asset-file';
    document.body.appendChild(a); a.click(); a.remove();
  }
  toast('Downloading ' + (res.data.fileName || 'file'));
}
async function onDownload(id) {
  const res = await API.download(id, STATE.user);
  triggerFileDownload(res);
}

async function onComment(e) {
  e.preventDefault();
  const f = e.target;
  const picked = f.querySelector('.stars-pick .on:last-of-type');
  const rating = picked ? Number(picked.dataset.r) : 0;
  if (!rating || rating < 1 || rating > 5) { toast('Pick a star rating (1–5) to post your comment.', 'err'); return; }
  const res = await API.addComment(STATE.user, f.dataset.asset, { body: f.body.value, rating });
  if (res.ok) { toast('Comment posted — thanks for the feedback!'); await router(); } else toast(res.error, 'err');
}

/* ---- reviews & ratings actions ---- */
function starsHtml(avg) {
  const r = Math.max(0, Math.min(5, Math.round(Number(avg) || 0)));
  let s = '<span class="stars">';
  for (let i = 1; i <= 5; i++) s += `<span class="${i <= r ? '' : 'off'}">★</span>`;
  return s + '</span>';
}
function pickStars(boxId, r) {
  const box = document.getElementById(boxId);
  if (!box) return;
  box.querySelectorAll('.star-btn').forEach(b => b.classList.toggle('on', Number(b.dataset.r) <= r));
}
function pickStar(assetId, r) {
  const box = document.getElementById('rp-' + assetId);
  if (!box) return;
  box.querySelectorAll('.star-btn').forEach(b => b.classList.toggle('on', Number(b.dataset.r) <= r));
  const form = box.closest('form');
  if (form) form.rating.value = r;
}
async function onSubmitReview(e, assetId) {
  e.preventDefault();
  const f = e.target;
  const rating = Number(f.rating.value);
  if (!rating || rating < 1 || rating > 5) { toast('Pick a star rating.', 'err'); return; }
  const res = await API.addReview(STATE.user, assetId, { rating, body: f.body.value });
  if (res.ok) { toast('Review posted.'); await router(); } else toast(res.error, 'err');
}
async function onDeleteReview(reviewId) {
  const res = await API.deleteReview(STATE.user, reviewId);
  if (res.ok) { toast('Review removed.'); await router(); } else toast(res.error, 'err');
}

/* ---- reporting flow ---- */
function onReport(type, id) {
  if (!STATE.user) { go('/login'); return; }
  const labels = { asset: 'this asset', comment: 'this comment', user: 'this user' };
  const reasons = ['Scam or fraudulent listing', 'Stolen or unlicensed content', 'Inappropriate content', 'Spam', 'Harassment or abuse', 'Other'];
  modal({
    title: 'Report ' + labels[type],
    confirmLabel: 'Submit report',
    body: `<p>Reports are reviewed by the Kings Production team. Please be specific.</p>
      <div class="field"><label>Reason</label><select class="select" id="rep-reason">${reasons.map(r => `<option>${esc(r)}</option>`).join('')}</select></div>
      <div class="field"><label>Details (optional)</label><textarea class="textarea" id="rep-details" maxlength="1000" placeholder="Add any context that will help our team review this…"></textarea></div>`,
    validate: async ov => {
      const reason = ov.querySelector('#rep-reason').value;
      const details = ov.querySelector('#rep-details').value.trim();
      const res = await API.createReport(STATE.user, { targetType: type, targetId: id, reason, details });
      if (!res.ok) { toast(res.error, 'err'); return false; }
      toast('Report submitted — thank you. Our team will review it.');
      return true;
    },
  });
}
function repIconHtml(type) {
  return `<span style="position:relative;color:#fff">${ICON[type === 'asset' ? 'model' : type === 'comment' ? 'mail' : 'user']}</span>`;

  const box = document.getElementById('pf-tags-box');
  if (!box) return;
  box.innerHTML = STATE._pfTags.length ? STATE._pfTags.map(t => `<span class="chip" style="padding:4px 10px;font-size:11.5px;cursor:default">#${esc(t)}<button type="button" class="chip-x" onclick="removeProfileTag('${esc(t)}')" aria-label="Remove tag">×</button></span>`).join('') : '<span class="muted small">No extra tags yet.</span>';

function addProfileTag(t) {
  t = String(t || '').trim();
  if (!t) { toast('Type a tag first.', 'err'); return; }
  if (STATE._pfTags.length >= 6) { toast('Maximum of 6 tags.', 'err'); return; }
  if (STATE._pfTags.some(x => x.toLowerCase() === t.toLowerCase())) { toast('That tag is already added.', 'err'); return; }
  STATE._pfTags.push(t);
  renderProfileTags();
}

  STATE._pfTags = STATE._pfTags.filter(x => x.toLowerCase() !== String(t).toLowerCase());

async function handleLogin(e) {
  e.preventDefault();
  const f = e.target;
  const res = await API.login({ login: f.login.value, password: f.password.value, acceptTerms: !!(f.acceptTerms && f.acceptTerms.checked) });
  if (!res.ok) { toast(res.error, 'err'); if (res.code === 'banned') await router(); return; }
  if (res.data && res.data.need2fa) { STATE.twoFactorUserId = res.data.userId; await router(); return; }
  STATE.user = res.data; renderHeader();
  if (isUnverified(res.data)) toast('Welcome back! Tip: verify your email in Settings for account recovery.', 'warn');
  else toast('Welcome back, ' + res.data.displayName);
  SFX.play('crown'); go('/');
}
async function onVerify2fa(e) {
  e.preventDefault();
  const res = await API.verify2fa({ userId: STATE.twoFactorUserId, code: e.target.code.value });
  if (!res.ok) { toast(res.error, 'err'); return; }
  STATE.twoFactorUserId = null; STATE.user = res.data; renderHeader();
  if (isUnverified(res.data)) toast('Logged in. Tip: verify your email in Settings for account recovery.', 'warn');
  else toast('Logged in securely.');
  go('/');
}
async function onSendRegCode() {
  const emailEl = document.getElementById('reg-email');
  const email = emailEl ? emailEl.value.trim() : '';
  if (!email) { toast('Enter your email first.', 'err'); emailEl && emailEl.focus(); return; }
  const btn = document.getElementById('send-code-btn');
  if (btn) btn.disabled = true;
  const res = await API.requestRegisterCode({ email });
  if (!res.ok) { toast(res.error, 'err'); if (btn) btn.disabled = false; return; }
  const field = document.getElementById('reg-code-field');
  if (field) field.style.display = '';
  const codeInput = field && field.querySelector('input[name=code]');
  if (codeInput) codeInput.focus();
  if (res.data && res.data.devCode) toast('Dev code: ' + res.data.devCode, 'dev');
  else toast('Verification code sent — check your inbox (and spam).');
  if (btn) {
    let s = 45;
    btn.textContent = 'Resend in ' + s;
    const iv = setInterval(() => { s--; if (s <= 0) { clearInterval(iv); btn.innerHTML = (ICON.mail || '') + ' Send code'; btn.disabled = false; } else btn.textContent = 'Resend in ' + s; }, 1000);
  }
}
async function handleRegister(e) {
  e.preventDefault();
  const f = e.target;
  const res = await API.register({ handle: f.handle.value, displayName: f.displayName.value, email: f.email.value, password: f.password.value, country: f.country ? f.country.value : 'US', acceptTerms: !!(f.acceptTerms && f.acceptTerms.checked), code: f.code ? f.code.value.trim() : '' });
  if (!res.ok) { toast(res.error, 'err'); return; }
  STATE.user = res.data; renderHeader(); toast('Account created — welcome! (Tip: verify your email in Settings for account recovery.)'); SFX.play('crown'); go('/');
}
async function handleForgot(e) {
  e.preventDefault();
  const res = await API.requestReset({ email: e.target.email.value });
  if (!res.ok) { toast(res.error, 'err'); return; }
  toast('If that email exists, a reset link is on its way.');
  if (res.data && res.data.devLink) {
    modal({ title: 'Reset link sent',
      body: `<p>An email was sent to ${esc(e.target.email.value)}. In this development preview, mail is delivered to a local mailbox instead of a real inbox.</p><p><a class="btn btn-primary btn-sm" href="${res.data.devLink}">Open the reset link</a></p><p class="muted small">Admins can view all sent mail in the Admin Panel → Mailbox.</p>` });
  }
}
async function handleReset(e) {
  e.preventDefault();
  const f = e.target;
  if (f.password.value !== f.confirm.value) { toast('Passwords do not match.', 'err'); return; }
  const res = await API.resetPassword({ token: f.token.value, password: f.password.value });
  if (!res.ok) { toast(res.error, 'err'); return; }
  toast('Password updated. Log in with your new password.'); go('/login');
}

function totpLiveHtml(secret, digits = 6) {
  return `<div class="totp-live">
    <svg class="totp-ring" viewBox="0 0 52 52"><circle class="track" cx="26" cy="26" r="23"/><circle class="arc" id="totp-arc" cx="26" cy="26" r="23" stroke-dasharray="144.5" stroke-dashoffset="0" transform="rotate(-90 26 26)"/></svg>

async function onSetup2fa() {
  const res = await API.setup2fa(STATE.user);
  if (!res.ok) { toast(res.error, 'err'); return; }
  const { secret, uri, email } = res.data;
  stopTotpTimer();
  const ov = modal({
    title: 'Set up two-factor authentication', confirmLabel: 'Enable 2FA',
    body: `<p>Add this secret to an authenticator app, or use the live code below during setup. You will need a code to log in from new sessions.</p>
      <div class="field"><label>Secret key</label><input class="input mono" id="tfa-secret" value="${secret}" readonly onclick="this.select()"><div class="hint">Click to select. Scan or type this into your authenticator.</div></div>
      ${totpLiveHtml(secret)}
      <div class="field mt"><label>Verification code</label><input class="input otp-input" id="tfa-code" inputmode="numeric" maxlength="6" placeholder="••••••" required></div>
      <p class="muted small">Authenticator URI: <span class="mono" style="word-break:break-all;font-size:11px">${esc(uri)}</span></p>`,
    validate: async ov => {
      const code = ov.querySelector('#tfa-code').value.trim();
      if (!/^\d{6}$/.test(code)) { toast('Enter the 6-digit code.', 'err'); return false; }
      const r = await API.enable2fa(STATE.user, { code });
      if (!r.ok) { toast(r.error, 'err'); return false; }
      return true;
    },
    onConfirm: async () => { stopTotpTimer(); toast('Two-factor authentication enabled.'); await router(); },
    onClose: stopTotpTimer,
  });
  const tick = async () => {
    const el = document.getElementById('totp-code'); if (!el) { stopTotpTimer(); return; }
    const code = await totpCode(secret);
    el.textContent = code;
    const rem = 30 - (Math.floor(Date.now() / 1000) % 30);

    if (arc) arc.setAttribute('stroke-dashoffset', String(144.5 * (1 - rem / 30)));

  tick(); _totpTimer = setInterval(tick, 1000);
  ov._close = ov.querySelector('[data-act=cancel]').onclick;
}

}

async function onSubmitAsset(e) {
  e.preventDefault();
  const f = e.target;
  const fileInput = f.file;
  const file = fileInput.files && fileInput.files[0];
  if (file && file.size > 100 * 1024 * 1024) { toast('File is too large (max 100 MB).', 'err'); return; }
  if (!file && !f.assetId.value) { toast('A system file is required.', 'err'); return; }
  const images = [...f.querySelectorAll('#up-imgs input')].map(i => i.value.trim()).filter(Boolean);
  const paymentMethods = [...f.querySelectorAll('input[name=pm]:checked')].map(c => c.value);
  const priceNum = Number(f.price.value);
  /* Free posts (price 0) skip payment entirely — no methods needed. Paid
     posts must have at least one accepted method. */
  if (priceNum > 0 && !paymentMethods.length) { toast('Select at least one accepted payment method — buyers can only pay with methods you accept. (Set the price to 0 to post for free instead.)', 'err'); return; }
  const sellerPaymentDetails = collectSellerPmDetails();
  /* Manual methods must carry at least one contact point (QR image or account) —
     otherwise the buyer has no way to pay you. */
  for (const m of paymentMethods) {
    if (m !== 'gcash' && m !== 'kofi') continue;
    const d = sellerPaymentDetails[m] || {};
    if (!d.qrUrl && !d.accountName && !d.accountNumber) {
      toast(m === 'gcash' ? 'Add your GCash QR image or account details — buyers need a way to pay you.' : 'Add your Ko-fi QR or page details — buyers need a way to pay you.', 'err');
      return;
    }
  }
  const deliverDuringPending = f.querySelector('input[name=deliverDuringPending]').checked;
  const freeLicensed = priceNum > 0 ? false : !!(f.querySelector('input[name=freeLicensed]') && f.querySelector('input[name=freeLicensed]').checked);
  const backupUrl = (f.backupUrl && f.backupUrl.value || '').trim();
  const btn = f.querySelector('button[type=submit]');
  const origLabel = btn.textContent;
  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    let fileData = null, fileName = null, fileUrl = null;
    if (file) {
      /* Send the file to the host (Catbox) so only a URL is stored. If the
         host fails, fall back to raw upload so the post never gets lost. */
      const upBtn = f.querySelector('#up-file-host');
      const hosted = await uploadSystemFile(file, upBtn);
      if (hosted.ok) { fileUrl = hosted.url; fileName = file.name; }
      else { toast('Could not reach the file host — storing the file directly instead.', 'warn'); fileData = await readFileAsDataURL(file); fileName = file.name; }
    }
    const payload = { title: f.title.value, category: f.category.value, description: f.description.value, price: f.price.value, imageUrl: f.imageUrl.value.trim(), images, paymentMethods, sellerPaymentDetails, deliverDuringPending, freeLicensed, backupUrl, fileName, fileData, fileUrl };
    const res = f.assetId.value
      ? await API.updateAsset(STATE.user, f.assetId.value, payload)
      : await API.createAsset(STATE.user, payload);
    if (!res.ok) { toast(res.error, 'err'); return; }
    toast(f.assetId.value ? 'Changes saved.' : (res.data && res.data.status === 'approved') ? 'Posted! It is live in the shop.' : 'Asset submitted for admin approval.');
    go('/my-assets');
  } catch (err) {
    console.error(err);
    toast('Submit failed — please try again.', 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = origLabel;
  }
}
/* One extra-photo row in the upload form. */
function addUploadImageRow(url = '') {
  const host = document.getElementById('up-imgs');
  if (!host) return;
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:8px;align-items:center';

  row.querySelector('button').onclick = () => row.remove();
  row.appendChild(imageUploadButton(row.querySelector('input')));

}
function initUploadExtras(asset) {
  (asset && asset.images ? asset.images : []).forEach(u => addUploadImageRow(u));
  const addBtn = document.getElementById('up-add-img');
  if (addBtn) addBtn.onclick = () => addUploadImageRow();
  const savedPm = asset && Array.isArray(asset.paymentMethods) ? asset.paymentMethods : [];
  document.querySelectorAll('input[name=pm]').forEach(c => { c.checked = savedPm.includes(c.value); });
  const savedDetails = (asset && asset.sellerPaymentDetails && typeof asset.sellerPaymentDetails === 'object') ? asset.sellerPaymentDetails : {};
  renderSellerPmDetails();
  document.querySelectorAll('input[name=pm]').forEach(c => c.addEventListener('change', renderSellerPmDetails));
  if (asset) {
    const ddp = document.querySelector('input[name=deliverDuringPending]');
    if (ddp) ddp.checked = !!asset.deliverDuringPending;
  }
}
/* Per-method payment details the buyer sees at checkout (QR image, account, notes). */
const PM_FIELDS = {
  gcash: [['qrUrl', 'GCash QR image URL', 'https://i.imgur.com/your-qr.png'], ['accountName', 'Account name', 'e.g. Juan Dela Cruz'], ['accountNumber', 'GCash mobile number', 'e.g. 09XX XXX XXXX'], ['instructions', 'Instructions for the buyer', 'What the buyer should do after sending…']],
  kofi: [['qrUrl', 'Ko-fi QR image URL (optional)', 'https://i.imgur.com/your-qr.png'], ['accountName', 'Ko-fi page name / link', 'e.g. ko-fi.com/yourpage'], ['instructions', 'Instructions for the buyer', 'What the buyer should do after sending…']],
  paypal: [['accountName', 'PayPal account (email)', 'you@example.com'], ['accountNumber', 'PayPal name (optional)', 'e.g. Juan Dela Cruz'], ['instructions', 'Instructions for the buyer', 'What the buyer should do after sending…']],
  stripe: [['accountName', 'Stripe account label', 'e.g. Kings Production'], ['instructions', 'Instructions for the buyer', 'What the buyer should do after sending…']],
};
function renderSellerPmDetails() {
  const host = document.getElementById('up-pm-details');
  if (!host) return;
  const chosen = [...document.querySelectorAll('input[name=pm]:checked')].map(c => c.value);
  const saved = (STATE._uploadAsset && STATE._uploadAsset.sellerPaymentDetails && typeof STATE._uploadAsset.sellerPaymentDetails === 'object') ? STATE._uploadAsset.sellerPaymentDetails : {};
  host.innerHTML = chosen.map(m => {
    const labels = { gcash: 'GCash', kofi: 'Ko-fi', paypal: 'PayPal', stripe: 'Stripe' };
    const d = saved[m] || {};
    const fields = (PM_FIELDS[m] || []).map(([k, label, ph]) => `<div class="field" style="margin:0"><label>${label}</label><input class="input" data-pm-field="${m}:${k}" value="${esc(d[k] || '')}" placeholder="${ph}"></div>`).join('');
    return `<div style="border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--surface-2)">
      <b style="font-size:13px">${labels[m] || m} — what buyers see at checkout</b>
      <div style="display:grid;gap:10px;margin-top:10px">${fields}</div>
    </div>`;
  }).join('');
  /* The QR-image field of every manual method gets an Upload button. */
  host.querySelectorAll('input[data-pm-field$=":qrUrl"]').forEach(inp => {
    if (inp.closest('.kp-upwrap')) return;
    const wrap = document.createElement('span');
    wrap.className = 'kp-upwrap';
    wrap.style.cssText = 'display:flex;gap:8px;align-items:center';
    inp.parentNode.insertBefore(wrap, inp);
    wrap.appendChild(inp);
    wrap.appendChild(imageUploadButton(inp));
  });
}
function collectSellerPmDetails() {
  const out = {};
  document.querySelectorAll('#up-pm-details [data-pm-field]').forEach(inp => {
    const [m, k] = inp.getAttribute('data-pm-field').split(':');
    (out[m] = out[m] || {})[k] = inp.value.trim();
  });
  return out;
}

    if (freeLicWrap) freeLicWrap.style.display = isFree ? '' : 'none';
    if (!isFree && freeLicBox) freeLicBox.checked = false;

  apply();
};

------------

  (Registered Systems → Games) before it runs.

	- With Ban-on-blacklist ON: blacklisting the game (leak response) BANS
	  every player in it from Roblox (Players:BanAsync) and the bans are
	  lifted automatically once the game is allowed again.

	ANTI-TAMPER
	-----------
	The shipped copy embeds a SHA-256 fingerprint of its own source. Roblox
	hides script.Source from live servers, so the fingerprint check runs in
	Studio (where it is enforced hard) and is skipped automatically in a
	published game — there the protection is the portal itself: pause / kick /
	device denial, plus obfuscation. Obfuscate before shipping; the password
	lives inside the script and obfuscation makes pulling it out much harder.

API CONTRACT (what the portal returns)
--------------------------------------

Body:  { systemName, systemPassword, deviceId, deviceName, placeId,

Reply: { ok: true, data: { active: true|false, reason: "...", kicked: true|false } }

local HttpService = game:GetService("HttpService")

	SystemPassword = "__SYSTEM_PASSWORD__",  -- ← YOUR registered system password

	ApiUrl = "https://kingsproduction.cc/api/systems/activate",
	HeartbeatUrl = "https://kingsproduction.cc/api/systems/heartbeat",
	PlayerUrl = "https://kingsproduction.cc/api/systems/device",

	HeartbeatSeconds = 300,                  -- re-check every 5 minutes
	RetrySeconds = 15,                       -- retry interval when a check fails
	RequestTimeout = 10,                     -- give up on a request after ~10s
	ProtectedObjectName = "__PROTECTED_OBJECT__",  -- script/object to disable when unlicensed
}

-- ANTI-TAMPER — do not remove. The site pre-computes this fingerprint from
-- this exact script. If the script is edited (license check stripped), the
-- fingerprint stops matching and the system hard-fails instead of running.
-- ("" = unlocked spec copy — the site's "Studio code" button fills it in.)
local TAMPER_KEY = "__FINGERPRINT__"

-- ENFORCEMENT — the web answers with revokeAll / banAll / unban flags (the
-- Licensed Dashboard's Kick-on-deny and Ban-on-blacklist toggles):
--   revokeAll=true  → EVERY player in the game is force-disconnected now.
--   banAll=true     → every player is BANNED from Roblox (Players:BanAsync).
--   unban=true      → the license is good again; past kick-bans are lifted.
-- Default kickOnDeny=ON: a leaked copy cannot keep running with a free
-- activation — everyone is kicked until the creator fixes the license.

-- Roblox's crypt.hash returns a BASE64-encoded SHA-256; the site bakes the
-- same encoding. script.Source is only readable in Studio, so in a live game
-- this check is skipped automatically — the portal's pause/kick is the real
-- protection there.
local function fingerprint()
	local src = script.Source
	if src == "" then return "" end -- live server: source hidden, skip check
	src = string.gsub(src, "\\r\\n", "\\n") -- line-ending normalization
	src = string.gsub(src, 'local TAMPER_KEY = "[^"]*"', 'local TAMPER_KEY = ""')
	return string.sub(crypt.hash(src, Enum.CryptHashAlgorithm.SHA256), 1, 12)
end

-- Only Scripts / LocalScripts have a Disabled property — disable those safely
-- and leave everything else to the License.IsLicensed() gate.
local function setProtectedDisabled(disabled)
	if not ProtectedObject then return end
	if ProtectedObject:IsA("Script") or ProtectedObject:IsA("LocalScript") then
		ProtectedObject.Disabled = disabled
	end

-- POST a JSON payload with a hard timeout, return the decoded response (or nil)
local function post(url, payload)
	local body = HttpService:JSONEncode(payload)
	local ok, res = false, nil
	local done = false
	task.spawn(function()
		ok, res = pcall(function()
			return HttpService:RequestAsync({
				Url = url,
				Method = "POST",
				Headers = { ["Content-Type"] = "application/json" },
				Body = body,
			})
		end)
		done = true
	end)
	local waited = 0
	while not done and waited < CONFIG.RequestTimeout do
		task.wait(1)
		waited = waited + 1
	end
	if not done then
		License.LastError = "Request timed out"
		return nil
	end
	if not ok or not res then
		License.LastError = "Request failed"
		return nil
	end
	local okDecode, json = pcall(function()
		return HttpService:JSONDecode(res.Body)
	end)
	if not okDecode then
		License.LastError = "Bad response"
		return nil
	end
	return json
end

-- Force-kick every player whose device was kicked by the creator.
local function kickPlayers(ids)
	if type(ids) ~= "table" then return end
	for _, id in ipairs(ids) do
		local player = Players:GetPlayerByUserId(tonumber(id))
		if player then
			log("Kicking unauthorized player " .. player.Name)
			player:Kick("This device is not authorized for this system.")
		end
	end
end
